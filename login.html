<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Login — TextilePOS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body{font-family:'Inter',system-ui,sans-serif}
  html.dark body { background: #111827 !important; }
  html.dark .bg-white { background: #1f2937 !important; }
  html.dark .text-gray-800, html.dark .text-gray-700 { color: #e5e7eb !important; }
  html.dark .text-gray-500 { color: #9ca3af !important; }
  html.dark input { background: #374151 !important; color: #e5e7eb !important; border-color: #4b5563 !important; }
</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-900 flex items-center justify-center p-4">

<div class="w-full max-w-md">
  <div class="bg-white rounded-3xl shadow-2xl p-7">
    <div class="text-center mb-6">
      <div class="text-5xl mb-2">🧵</div>
      <h1 class="text-2xl font-extrabold">Login</h1>
      <p class="text-gray-500 text-xs mt-1">Shop ID / Mobile / Email</p>
    </div>

    <form id="loginForm" class="space-y-3" autocomplete="off">
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">Shop ID / Mobile / Email</label>
        <input id="inpIdentifier" required placeholder="SHOP-XXXXXX / 9876543210 / email"
          class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">
          Username <span class="text-gray-400 font-normal">(leave empty for admin)</span>
        </label>
        <input id="inpUsername" placeholder="e.g. karim" autocomplete="off"
          class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">Password</label>
        <input id="inpPassword" type="password" required autocomplete="current-password"
          class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none">
      </div>

      <button id="btnLogin" type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-xl font-bold shadow-lg active:scale-[.98] transition disabled:opacity-60">
        Login
      </button>
    </form>

    <div class="mt-5 text-center">
      <a href="register.html" class="text-sm text-blue-600 font-semibold hover:underline">
        New shop? Register here →
      </a>
    </div>

    <div class="mt-4 pt-4 border-t border-gray-100 text-center">
      <a href="index.html" class="text-xs text-gray-500 hover:underline">← Home</a>
    </div>
  </div>
</div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="common.js"></script>
<script>
/* ============================================================
   LOGIN
   ============================================================ */
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();

  const raw = document.getElementById('inpIdentifier').value.trim();
  const username = document.getElementById('inpUsername').value.trim().toLowerCase().replace(/\s+/g, '');
  const password = document.getElementById('inpPassword').value;

  const btn = document.getElementById('btnLogin');
  btn.disabled = true;
  btn.textContent = 'Please wait...';

  try {
    let email = null;

    if (raw.includes('@')) {
      // Direct email
      email = TP.normalizeEmail(raw);
      if (username) throw new Error('Leave username empty for email login');

    } else if (raw.toUpperCase().startsWith('SHOP-')) {
      // Shop ID
      const shopId = raw.toUpperCase();
      const shopSnap = await TP.db.collection('shops').doc(shopId).get();
      if (!shopSnap.exists) throw new Error('Shop ID not found');
      const shopData = shopSnap.data();

      if (username) {
        email = TP.salesmanEmail(shopId, username);
      } else {
        if (!shopData.adminEmail) throw new Error('Admin email not found');
        email = shopData.adminEmail;
      }
    } else {
      // Phone
      const phone = TP.normalizePhone(raw);
      if (!TP.isValidPhone(phone)) throw new Error('Enter valid mobile');
      const phoneSnap = await TP.db.collection('phoneIndex').doc(phone).get();
      if (!phoneSnap.exists) throw new Error('This number is not registered');
      const data = phoneSnap.data();

      if (username) {
        email = TP.salesmanEmail(data.shopId, username);
      } else {
        if (!data.email) throw new Error('Admin email not found');
        email = data.email;
      }
    }

    if (!email) throw new Error('Invalid credentials');

    await TP.auth.signInWithEmailAndPassword(email, password);

  } catch (err) {
    console.error(err);
    let msg = err.message || 'Login failed';
    if (['auth/user-not-found','auth/wrong-password','auth/invalid-credential','auth/invalid-login-credentials'].includes(err.code)) {
      msg = 'Invalid username or password';
    }
    if (err.code === 'auth/too-many-requests') msg = 'Too many attempts. Try again later.';
    if (err.code === 'auth/network-request-failed') msg = 'No internet connection';
    TP.toast(msg, 'error');
    btn.disabled = false;
    btn.textContent = 'Login';
  }
});

/* Auto redirect + force password change */
TP.auth.onAuthStateChanged(async user => {
  if (!user) {
    const b = document.getElementById('btnLogin');
    if (b) { b.disabled = false; b.textContent = 'Login'; }
    return;
  }
  try {
    const userDoc = await TP.db.collection('users').doc(user.uid).get();
    if (!userDoc.exists) { await TP.auth.signOut(); return; }
    const userData = userDoc.data();

    if (userData.mustChangePassword) {
      showForcePassword(user, userData);
      return;
    }

    location.href = userData.role === 'admin' ? 'admin.html' : 'salesman.html';
  } catch (err) {
    console.error(err);
    TP.toast('Login failed', 'error');
  }
});

/* Force password change modal */
function showForcePassword(user, userData) {
  if (document.getElementById('forcePwModal')) return;

  const modal = document.createElement('div');
  modal.id = 'forcePwModal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
  modal.innerHTML = `
    <div style="background:#fff;border-radius:24px;max-width:420px;width:100%;padding:28px;font-family:Inter,sans-serif">
      <div style="text-align:center;margin-bottom:16px">
        <div style="font-size:48px;margin-bottom:8px">🔐</div>
        <h2 style="font-size:20px;font-weight:800;margin:0">Change Password</h2>
        <p style="color:#6b7280;font-size:12px;margin:6px 0 0">
          You logged in with a temporary password.<br>Please set a new one.
        </p>
      </div>
      <input id="fpNew1" type="password" placeholder="New password (min 6 chars)"
        style="width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:12px;font-family:inherit;font-size:14px;margin-bottom:10px;box-sizing:border-box">
      <input id="fpNew2" type="password" placeholder="Confirm new password"
        style="width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:12px;font-family:inherit;font-size:14px;margin-bottom:16px;box-sizing:border-box">
      <button id="fpSubmit"
        style="width:100%;background:#2563eb;color:#fff;padding:14px;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit">
        Change Password
      </button>
    </div>`;
  document.body.appendChild(modal);

  document.getElementById('fpSubmit').addEventListener('click', async () => {
    const n1 = document.getElementById('fpNew1').value;
    const n2 = document.getElementById('fpNew2').value;
    if (n1.length < 6) { TP.toast('Minimum 6 characters', 'error'); return; }
    if (n1 !== n2)     { TP.toast('Passwords do not match', 'error'); return; }

    const btn = document.getElementById('fpSubmit');
    btn.disabled = true; btn.textContent = '...';

    try {
      await user.updatePassword(n1);
      await TP.db.collection('users').doc(user.uid).update({ mustChangePassword: false });
      TP.toast('Password changed', 'success');
      setTimeout(() => {
        location.href = userData.role === 'admin' ? 'admin.html' : 'salesman.html';
      }, 600);
    } catch (err) {
      console.error(err);
      let msg = 'Failed to change';
      if (err.code === 'auth/requires-recent-login') msg = 'Please login again';
      TP.toast(msg, 'error');
      btn.disabled = false; btn.textContent = 'Change Password';
    }
  });
}
</script>
</body>
</html>
