<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Salesman — TextilePOS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">
<style>
  *{ -webkit-tap-highlight-color:transparent; }
  body{ font-family:'Inter',system-ui,sans-serif; }
  input,select,textarea,button{ font-family:inherit; }
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
  .slide-up{animation:slideUp .25s cubic-bezier(.2,.9,.3,1)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .fade-in{animation:fadeIn .2s ease}
  .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .no-spin::-webkit-outer-spin-button,.no-spin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .hide{display:none !important}
  @keyframes scanPulse{0%,100%{box-shadow:0 0 0 0 rgba(22,163,74,.4)}50%{box-shadow:0 0 0 8px rgba(22,163,74,0)}}
  .scan-pulse{animation:scanPulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .pulse{animation:pulse 1.5s infinite}
  .spin{display:inline-block;animation:spin 1s linear infinite}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  html.dark body { background: #111827 !important; color: #e5e7eb; }
  html.dark .bg-white { background: #1f2937 !important; }
  html.dark .bg-gray-100 { background: #111827 !important; }
  html.dark .bg-gray-50 { background: #1a202c !important; }
  html.dark .text-gray-800, html.dark .text-gray-700 { color: #e5e7eb !important; }
  html.dark .text-gray-500, html.dark .text-gray-600 { color: #9ca3af !important; }
  html.dark .border-gray-200, html.dark .border-gray-100 { border-color: #374151 !important; }
  html.dark input, html.dark select, html.dark textarea { background: #374151 !important; color: #e5e7eb !important; border-color: #4b5563 !important; }
  html.dark .hover\:bg-gray-50:hover { background: #374151 !important; }
</style>
</head>
<body class="bg-gray-100 text-gray-800">

<div id="loadingScreen" class="fixed inset-0 bg-green-600 flex items-center justify-center z-[999]">
  <div class="text-white text-center">
    <div class="text-6xl mb-3">🧵</div>
    <div class="text-lg font-bold">Loading...</div>
  </div>
</div>

<div id="app" class="hide min-h-screen">
  <header class="fixed top-0 inset-x-0 h-14 bg-green-600 text-white flex items-center px-2 z-40 shadow-md">
    <button id="menuBtn" class="p-2 w-11 h-11 flex items-center justify-center rounded-lg active:bg-white/20">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <h1 id="pageTitle" class="flex-1 text-lg font-bold ml-1 truncate">POS</h1>
    <div class="text-right leading-tight pr-2">
      <div id="userName" class="text-sm font-semibold truncate max-w-[120px]"></div>
      <div class="text-[10px] opacity-80">Salesman</div>
    </div>
  </header>

  <div id="drawerBackdrop" class="hide fixed inset-0 bg-black/60 z-50"></div>
  <aside id="drawer" class="fixed top-0 left-0 bottom-0 w-72 max-w-[85vw] bg-white z-[60] -translate-x-full transition-transform duration-300 shadow-2xl overflow-y-auto">
    <div class="bg-green-600 text-white p-5">
      <div class="text-3xl mb-2">🧵</div>
      <div id="drawerShop" class="font-bold text-base truncate"></div>
      <div class="mt-1.5 inline-flex items-center gap-1 text-[11px] bg-white/20 px-2 py-1 rounded-md">
        <span>Shop:</span><span id="drawerShopId" class="font-mono font-bold"></span>
      </div>
      <div id="drawerUser" class="text-[11px] opacity-80 mt-1.5"></div>
    </div>
    <nav id="drawerNav" class="p-2"></nav>
  </aside>

  <main class="pt-14 pb-24 min-h-screen">
    <section id="page-pos" class="page"></section>
    <section id="page-my-sales" class="page hide"></section>
    <section id="page-products" class="page hide"></section>
    <section id="page-customers" class="page hide"></section>
    <section id="page-settings" class="page hide"></section>
  </main>

  <div id="cartBar" class="hide fixed bottom-[68px] inset-x-0 z-30 px-3 pointer-events-none">
    <button id="openCartBtn" class="w-full pointer-events-auto bg-green-600 text-white rounded-2xl py-3.5 px-5 flex items-center justify-between shadow-2xl active:scale-[.98] transition">
      <span class="text-sm font-semibold">🛒 Cart: <span id="cartCount">0</span></span>
      <span class="font-extrabold text-lg" id="cartTotal">₹0</span>
      <span class="text-sm font-semibold bg-white/20 px-3 py-1 rounded-lg">Checkout →</span>
    </button>
  </div>

  <nav id="bottomNav" class="fixed bottom-0 inset-x-0 h-[68px] bg-white border-t border-gray-200 flex z-30 shadow-[0_-2px_10px_rgba(0,0,0,.05)]"></nav>
</div>

<div id="cartModal" class="hide fixed inset-0 z-[80] bg-black/60 items-end sm:items-center justify-center">
  <div class="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[94vh] flex flex-col slide-up">
    <div class="p-4 border-b flex items-center justify-between flex-shrink-0">
      <h2 class="font-bold text-lg">🛒 Cart</h2>
      <button data-close="cartModal" class="w-9 h-9 rounded-lg hover:bg-gray-100 text-2xl leading-none">×</button>
    </div>
    <div class="flex-1 overflow-y-auto p-4 space-y-2.5" id="cartItems"></div>
    <div class="p-4 border-t bg-gray-50 flex-shrink-0 max-h-[60vh] overflow-y-auto" id="cartCheckout"></div>
  </div>
</div>

<div id="invoiceModal" class="hide fixed inset-0 z-[85] bg-black/70 items-center justify-center p-2">
  <div class="bg-white w-full max-w-2xl rounded-2xl max-h-[96vh] flex flex-col fade-in">
    <div class="p-3 border-b flex items-center justify-between">
      <h2 class="font-bold">🧾 Invoice</h2>
      <button data-close="invoiceModal" class="w-9 h-9 rounded-lg hover:bg-gray-100 text-2xl leading-none">×</button>
    </div>
    <div class="flex-1 overflow-y-auto p-4" id="invoiceBody"></div>
    <div class="p-3 border-t flex gap-2 flex-wrap">
      <button id="printThermal" class="flex-1 min-w-[80px] bg-gray-700 text-white py-3 rounded-xl font-semibold text-sm active:scale-95">🖨 Thermal</button>
      <button id="printA4" class="flex-1 min-w-[80px] bg-green-600 text-white py-3 rounded-xl font-semibold text-sm active:scale-95">🖨 A4</button>
      <button id="waInvoice" class="flex-1 min-w-[80px] bg-green-600 text-white py-3 rounded-xl font-semibold text-sm active:scale-95">💬 WhatsApp</button>
      <button data-close="invoiceModal" class="flex-1 min-w-[80px] bg-gray-200 py-3 rounded-xl font-semibold text-sm active:scale-95">Close</button>
    </div>
  </div>
</div>

<iframe id="printFrame" style="position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;"></iframe>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="common.js"></script>

<script>
/* ============================================================
   SALESMAN PANEL
   ============================================================ */
const S = {
  profile: null, shopId: null,
  products: [], customers: [], sales: [],
  cart: [], saleType: 'retail', posSearch: '', posCategory: '',
  custMode: 'walkin', custId: '',
  currentInvoice: null, currentPage: 'pos',
  unsubs: [],
  scannerSessionId: null, scannerUnsub: null,
  paymentSessionId: null,
};

function openModal(id) { const m = document.getElementById(id); if (m) { m.classList.remove('hide'); m.classList.add('flex'); } }
function closeModal(id) { const m = document.getElementById(id); if (m) { m.classList.add('hide'); m.classList.remove('flex'); } }
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-close]');
  if (btn) closeModal(btn.dataset.close);
});

/* ── BOOT ── */
(async function boot() {
  const profile = await TP.requireAuth();
  S.profile = profile;
  S.shopId = profile.shopId;
  await restoreScannerSession();
  await restorePaymentSession();
  document.getElementById('loadingScreen').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  renderShell();
  setupListeners();
  goTo('pos');
})();

function renderShell() {
  document.getElementById('userName').textContent = S.profile.name;
  document.getElementById('drawerShop').textContent = S.profile.shop.shopName;
  document.getElementById('drawerShopId').textContent = S.shopId;
  document.getElementById('drawerUser').textContent = S.profile.name + ' · Salesman';
  updateBottomNav();
}

function setupListeners() {
  const sid = S.shopId;
  const shopRef = TP.db.collection('shops').doc(sid);
  S.unsubs.push(shopRef.collection('products').onSnapshot(s => {
    S.products = s.docs.map(d => ({ id: d.id, ...d.data() })); renderCurrent();
  }));
  S.unsubs.push(shopRef.collection('customers').onSnapshot(s => {
    S.customers = s.docs.map(d => ({ id: d.id, ...d.data() })); renderCurrent();
  }));
  S.unsubs.push(shopRef.collection('sales').where('salesmanId', '==', S.profile.uid).onSnapshot(s => {
    S.sales = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => {
      const da = a.saleDate?.toDate ? a.saleDate.toDate() : new Date(a.saleDate || 0);
      const db_ = b.saleDate?.toDate ? b.saleDate.toDate() : new Date(b.saleDate || 0);
      return db_ - da;
    });
    renderCurrent();
  }));
  S.unsubs.push(shopRef.onSnapshot(s => {
    if (s.exists) {
      S.profile.shop = { shopId: sid, ...s.data() };
      renderShell();
      if (S.currentPage === 'settings') renderSettings();
    }
  }));
}

const PAGE_TITLES = { pos: 'Point of Sale', 'my-sales': 'My Sales', products: 'Products', customers: 'Customers', settings: 'Settings' };

function goTo(page) {
  S.currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.add('hide'));
  const el = document.getElementById('page-' + page);
  if (el) el.classList.remove('hide');
  document.getElementById('pageTitle').textContent = PAGE_TITLES[page] || page;
  closeDrawer(); updateBottomNav(); renderCurrent();
  window.scrollTo({ top: 0 });
}

function renderCurrent() {
  if (!S.profile) return;
  switch (S.currentPage) {
    case 'pos': renderPOS(); break;
    case 'my-sales': renderMySales(); break;
    case 'products': renderProducts(); break;
    case 'customers': renderCustomers(); break;
    case 'settings': renderSettings(); break;
  }
  updateCartBar();
}

function updateBottomNav() {
  const items = [
    { p: 'pos', i: '🛒', l: 'POS' },
    { p: 'my-sales', i: '🧾', l: 'Sales' },
    { p: 'products', i: '📦', l: 'Products' },
    { p: '__menu', i: '☰', l: 'Menu' },
  ];
  document.getElementById('bottomNav').innerHTML = items.map(it => `
    <button data-nav="${it.p}" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-[11px] font-medium transition
      ${S.currentPage === it.p ? 'text-green-600' : 'text-gray-500'}">
      <span class="text-[22px] leading-none">${it.i}</span>
      <span>${it.l}</span>
    </button>`).join('');
  document.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.nav === '__menu') openDrawer();
    else goTo(b.dataset.nav);
  }));
}

function openDrawer() {
  document.getElementById('drawer').classList.remove('-translate-x-full');
  document.getElementById('drawerBackdrop').classList.remove('hide');
  buildDrawerNav();
}
function closeDrawer() {
  document.getElementById('drawer').classList.add('-translate-x-full');
  document.getElementById('drawerBackdrop').classList.add('hide');
}
document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);
document.getElementById('menuBtn').addEventListener('click', openDrawer);

function buildDrawerNav() {
  const items = [
    { p: 'pos', i: '🛒', l: 'Point of Sale' },
    { p: 'my-sales', i: '🧾', l: 'My Sales' },
    { p: 'products', i: '📦', l: 'Products' },
    { p: 'customers', i: '🧑‍🤝‍🧑', l: 'Customers' },
    { p: 'settings', i: '⚙️', l: 'Settings' },
  ];
  document.getElementById('drawerNav').innerHTML = items.map(it => `
    <button data-dnav="${it.p}" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-left font-medium
      ${S.currentPage === it.p ? 'bg-green-50 text-green-600' : 'text-gray-700 hover:bg-gray-50'}">
      <span class="text-xl">${it.i}</span><span>${it.l}</span>
    </button>`).join('') + `
    <div class="border-t my-2"></div>
    <button id="drawerLogout" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-left font-medium text-red-600 hover:bg-red-50">
      <span class="text-xl">🚪</span><span>Logout</span>
    </button>`;
  document.querySelectorAll('[data-dnav]').forEach(b => b.addEventListener('click', () => goTo(b.dataset.dnav)));
  document.getElementById('drawerLogout').addEventListener('click', async () => {
    closeDrawer();
    if (!await TP.askConfirm('Logout from this account?')) return;
    if (S.scannerSessionId) { try { await TP.deleteScannerSession(S.scannerSessionId); } catch {} S.scannerSessionId = null; localStorage.removeItem('tp_scanner_session'); }
    if (S.paymentSessionId) { try { await TP.deletePaymentSession(S.paymentSessionId); } catch {} S.paymentSessionId = null; localStorage.removeItem('tp_payment_session'); }
    await TP.auth.signOut();
  });
}

/* ============================================================
   POS
   ============================================================ */
function renderPOS() {
  const el = document.getElementById('page-pos');
  const cats = [...new Set(S.products.map(p => p.category).filter(Boolean))];
  el.innerHTML = `
    <div class="p-3 space-y-3">
      <div class="flex gap-2">
        <button id="typeRetail" class="flex-1 py-3 rounded-xl font-semibold text-sm transition">🏪 Retail</button>
        <button id="typeWhole" class="flex-1 py-3 rounded-xl font-semibold text-sm transition">🏭 Wholesale</button>
      </div>

      <div class="flex gap-2">
        <div class="relative flex-1 scan-pulse rounded-xl">
          <input id="barcodeInput" type="text" inputmode="numeric" autocomplete="off"
            placeholder="📷 Scan barcode or type..."
            class="w-full px-4 py-4 rounded-xl border-2 border-dashed border-green-500 bg-green-50 focus:border-green-700 focus:bg-white focus:outline-none text-base font-mono pr-12">
          <div class="absolute right-3 top-1/2 -translate-y-1/2 text-[9px] bg-green-600 text-white px-2 py-1 rounded font-bold pointer-events-none">SCAN</div>
        </div>
        <button id="qrScanBtn" class="px-4 rounded-xl bg-green-600 text-white font-bold text-2xl active:scale-95 transition" title="Scan Product QR">📱</button>
        <button id="custQrScanBtn" class="px-4 rounded-xl bg-purple-600 text-white font-bold text-2xl active:scale-95 transition" title="Scan Customer Help ID">👤</button>
      </div>

      <input id="posSearch" type="search" placeholder="🔍 Search product..." value="${TP.esc(S.posSearch)}"
        class="w-full px-4 py-3.5 rounded-xl border-2 border-gray-200 bg-white focus:border-green-500 focus:outline-none">

      ${cats.length ? `
      <div class="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1">
        <button data-cat="" class="cat-chip flex-shrink-0 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap">All</button>
        ${cats.map(c => `<button data-cat="${TP.esc(c)}" class="cat-chip flex-shrink-0 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap">${TP.esc(c)}</button>`).join('')}
      </div>` : ''}

      <div id="productGrid" class="grid grid-cols-2 gap-3 pb-2"></div>
    </div>`;

  const bcInput = document.getElementById('barcodeInput');
  bcInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); handleBarcodeScan(e.target.value.trim()); e.target.value = ''; }
  });
  setTimeout(() => bcInput.focus(), 200);

  document.getElementById('qrScanBtn').addEventListener('click', () => {
    TP.openQRScanner(code => handleBarcodeScan(String(code).trim()));
  });

  document.getElementById('custQrScanBtn').addEventListener('click', () => {
    TP.openQRScanner(async (code) => {
      const helpId = String(code).trim().toUpperCase();
      if (!helpId.startsWith('C-')) { TP.toast('Not a valid Help ID', 'error'); return; }
      try {
        const codeDoc = await TP.db.collection('customerCodes').doc(helpId).get();
        if (!codeDoc.exists) { TP.toast('Help ID not found', 'error'); return; }
        const data = codeDoc.data();
        const c = S.customers.find(x => x.id === data.customerId);
        if (!c) { TP.toast('Customer not in list', 'error'); return; }
        S.custMode = 'existing';
        S.custId = c.id;
        if (S.cart.length) {
          renderCartItems(); renderCartCheckout();
        }
        TP.toast(`✓ ${c.name} — ${c.loyaltyPoints || 0} pts`, 'success');
      } catch (e) { TP.toast(e.message, 'error'); }
    }, {
      title: '👤 Scan Customer QR',
      hint: 'Customer help ID QR scan করুন',
    });
  });

  document.getElementById('posSearch').addEventListener('input', e => { S.posSearch = e.target.value; renderProductGrid(); });
  document.getElementById('typeRetail').addEventListener('click', () => { S.saleType = 'retail'; updateTypeButtons(); renderProductGrid(); });
  document.getElementById('typeWhole').addEventListener('click', () => { S.saleType = 'wholesale'; updateTypeButtons(); renderProductGrid(); });
  document.querySelectorAll('.cat-chip').forEach(b => b.addEventListener('click', () => { S.posCategory = b.dataset.cat; renderProductGrid(); }));
  updateTypeButtons();
  renderProductGrid();
}

function handleBarcodeScan(code) {
  if (!code) return;
  const product = S.products.find(p => String(p.barcode || '').trim() === code);
  if (!product) { TP.toast('Barcode not found: ' + code, 'error'); return; }
  if ((+product.stockQty || 0) <= 0) { TP.toast(product.name + ' — Out of stock!', 'error'); return; }
  addToCart(product.id);
  TP.toast('✓ ' + product.name, 'success');
  const bc = document.getElementById('barcodeInput');
  if (bc) bc.focus();
}

function updateTypeButtons() {
  const r = document.getElementById('typeRetail'), w = document.getElementById('typeWhole');
  const on = 'bg-green-600 text-white shadow-lg', off = 'bg-white text-gray-600 border-2 border-gray-200';
  r.className = `flex-1 py-3 rounded-xl font-semibold text-sm transition ${S.saleType==='retail'?on:off}`;
  w.className = `flex-1 py-3 rounded-xl font-semibold text-sm transition ${S.saleType==='wholesale'?on:off}`;
}

function renderProductGrid() {
  const g = document.getElementById('productGrid');
  if (!g) return;
  const q = S.posSearch.trim().toLowerCase();
  const list = S.products.filter(p => {
    if (S.posCategory && p.category !== S.posCategory) return false;
    if (!q) return true;
    return (p.name||'').toLowerCase().includes(q) || (p.barcode||'').includes(q);
  });
  document.querySelectorAll('.cat-chip').forEach(b => {
    const on = b.dataset.cat === S.posCategory;
    b.className = `cat-chip flex-shrink-0 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap ${on ? 'bg-green-600 text-white' : 'bg-white text-gray-600 border border-gray-200'}`;
  });
  if (!list.length) {
    g.innerHTML = `<div class="col-span-2 text-center text-gray-400 py-16"><div class="text-5xl mb-3">📦</div><div>No products yet</div></div>`;
    return;
  }
  g.innerHTML = list.map(p => {
    const price = S.saleType === 'retail' ? (+p.retailPrice||0) : (+p.wholesalePrice||0);
    const stock = +p.stockQty || 0;
    const out = stock <= 0, low = !out && stock <= (+p.lowStockAlert||0);
    return `<button data-add="${p.id}" class="text-left bg-white rounded-2xl p-3.5 shadow-sm border border-gray-100 active:scale-95 transition ${out?'opacity-50':''}">
      ${p.imageUrl ? `<img src="${TP.esc(p.imageUrl)}" class="w-full h-20 object-cover rounded-lg mb-2" onerror="this.style.display='none'">` : ''}
      <div class="font-semibold text-gray-800 text-sm leading-snug line-clamp-2 min-h-[2.6rem]">${TP.esc(p.name)}</div>
      ${p.barcode ? `<div class="text-[9px] text-gray-400 font-mono truncate">#${TP.esc(p.barcode)}</div>` : ''}
      <div class="text-[11px] mt-1 font-medium ${out?'text-red-600':low?'text-orange-500':'text-gray-500'}">
        Stock: ${stock} ${TP.esc(p.unit||'')}${out?' · out':low?' · low':''}
      </div>
      <div class="text-green-600 font-extrabold mt-1.5 text-[17px]">${TP.money(price)}</div>
    </button>`;
  }).join('');
  g.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => addToCart(b.dataset.add)));
}

function addToCart(pid) {
  const p = S.products.find(x => x.id === pid);
  if (!p) return;
  const price = S.saleType === 'retail' ? (+p.retailPrice||0) : (+p.wholesalePrice||0);
  const exist = S.cart.find(it => it.productId === pid);
  const inCart = exist ? exist.qty : 0;
  if (inCart + 1 > (+p.stockQty||0)) { TP.toast('Out of stock!', 'error'); return; }
  if (exist) exist.qty++;
  else S.cart.push({ productId: pid, name: p.name, unit: p.unit||'', price, qty: 1 });
  updateCartBar();
}

function updateCartBar() {
  const bar = document.getElementById('cartBar');
  if (!bar) return;
  const count = S.cart.reduce((a, it) => a + it.qty, 0);
  const total = S.cart.reduce((a, it) => a + it.qty * it.price, 0);
  if (count === 0 || S.currentPage !== 'pos') { bar.classList.add('hide'); return; }
  bar.classList.remove('hide');
  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartTotal').textContent = TP.money(total);
}

document.getElementById('openCartBtn').addEventListener('click', openCart);

function openCart() {
  if (!S.cart.length) { TP.toast('Cart is empty', 'warn'); return; }
  S.custMode = 'walkin'; S.custId = '';

}

  el.querySelectorAll('[data-inc]').forEach(b => b.addEventListener('click', () => {

    it.qty++; renderCartItems(); updateSummary();
  }));
  el.querySelectorAll('[data-dec]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.dec, it = S.cart[i];
    if (it.qty > 1) it.qty--; else S.cart.splice(i, 1);
    renderCartItems(); updateSummary();
    if (!S.cart.length) closeModal('cartModal');
  }));
  el.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => {
    S.cart.splice(+b.dataset.rm, 1);
    renderCartItems(); updateSummary();
    if (!S.cart.length) closeModal('cartModal');
  }));
}

function updateSummary() {
  const subtotal = S.cart.reduce((a, it) => a + it.qty * it.price, 0);
  const discount = +((document.getElementById('discountInput')||{}).value || 0);
  const total = Math.max(0, subtotal - discount);
  let paid = (document.getElementById('paidInput')||{}).value;
  paid = paid === '' ? total : +paid;
  const due = Math.max(0, total - paid);
  const change = Math.max(0, paid - total);
  document.getElementById('sumSub').textContent = TP.money(subtotal);
  document.getElementById('sumDisc').textContent = '- ' + TP.money(discount);
  document.getElementById('sumTotal').textContent = TP.money(total);
  document.getElementById('sumPaid').textContent = TP.money(paid);
  document.getElementById('sumDue').textContent = TP.money(due);
  document.getElementById('sumChange').textContent = TP.money(change);

  const methodSelect = document.getElementById('payMethod');
  const pointsHint = document.getElementById('pointsHint');
  if (methodSelect && pointsHint) {
    const isPoints = methodSelect.value === 'points';
    if (isPoints && S.custMode !== 'existing') {
      pointsHint.classList.remove('hidden');
    } else {
      pointsHint.classList.add('hidden');
    }
  }
}

async function completeSale() {
  if (!S.cart.length) { TP.toast('Cart is empty', 'error'); return; }
  const subtotal = S.cart.reduce((a, it) => a + it.qty * it.price, 0);
  const discount = +((document.getElementById('discountInput')||{}).value || 0);
  const total = Math.max(0, subtotal - discount);
  let paidVal = (document.getElementById('paidInput')||{}).value;
  const paid = paidVal === '' ? total : (+paidVal || 0);
  const due = Math.max(0, total - paid);
  const method = (document.getElementById('payMethod')||{}).value || 'cash';
  const btn = document.getElementById('checkoutBtn');

  // Points payment
  let pointsUsed = 0;
  if (method === 'points') {
    if (S.custMode !== 'existing') { TP.toast('Select existing customer for points', 'error'); return; }
    const cid = (document.getElementById('custSelect')||{}).value || S.custId;
    const c = S.customers.find(x => x.id === cid);
    if (!c) { TP.toast('Customer not found', 'error'); return; }
    const avail = +c.loyaltyPoints || 0;
    if (avail <= 0) { TP.toast('Customer has no points', 'error'); return; }
    const maxUsable = Math.min(avail, total);
    pointsUsed = +window._pointsToRedeem || 0;
    if (pointsUsed <= 0) { TP.toast('Customer has not confirmed points yet', 'error'); return; }
    if (pointsUsed > avail) { TP.toast('Not enough points', 'error'); return; }
    if (pointsUsed > total) pointsUsed = total;
  }

  let splitPayments = null;
  if (window._splitPayments && window._splitPayments.length) {
    splitPayments = window._splitPayments;
    window._splitPayments = null;
  }

  // UPI payment flow
  if (method === 'upi') {
    const st = S.profile.shop.settings || {};
    if (!st.upiId) { TP.toast('UPI not set', 'error'); return; }
    let paidConfirm = false;
    if (S.paymentSessionId) {
      try {
        btn.disabled = true;
        btn.textContent = '📱 Sending to device...';
        const reqRef = await TP.createPaymentRequest(S.paymentSessionId, {
          amount: paid || total,
          invoiceNo: 'Pending',
        });
        const result = await showPaymentWaitModal({
          reqRef, amount: paid || total,
          shopName: st.shopName || S.profile.shop.shopName,
        });
        if (result === 'paid') { paidConfirm = true; TP.toast('✓ Payment confirmed', 'success'); }
        else { TP.toast('Payment cancelled', 'warn'); btn.disabled = false; btn.textContent = '✓ Complete Sale'; return; }
      } catch (e) {
        console.error(e);
        TP.toast('Could not reach device — using in-app QR', 'warn');
      }
    }
    if (!paidConfirm) {
      const payResult = await TP.showUPIPaymentModal({
        upiId: st.upiId, upiName: st.upiName,
        amount: paid || total, invoiceNo: 'Pending',
        shopName: st.shopName || S.profile.shop.shopName,
      });
      if (payResult !== 'received') {
        TP.toast('Payment cancelled', 'warn');
        btn.disabled = false; btn.textContent = '✓ Complete Sale';
        return;
      }
    }
  }

  btn.disabled = true; btn.textContent = 'Processing...';

  try {
    const shopRef = TP.db.collection('shops').doc(S.shopId);
    let customerId = null, customerName = 'Walk-in Customer', customerPhone = '', customerCode = null;
    let newCustomerRef = null;

    if (S.custMode === 'existing') {
      const cid = (document.getElementById('custSelect')||{}).value || S.custId;
      if (!cid) throw new Error('Select a customer');
      const c = S.customers.find(x => x.id === cid);
      if (c) {
        customerId = c.id; customerName = c.name; customerPhone = c.phone || '';
        customerCode = c.customerCode || null;
      }
    } else if (S.custMode === 'new') {
      const name = ((document.getElementById('newCustName')||{}).value || '').trim();
      const phone = ((document.getElementById('newCustPhone')||{}).value || '').trim();
      if (!name) throw new Error('Customer name required');
      newCustomerRef = shopRef.collection('customers').doc();
      customerId = newCustomerRef.id; customerName = name; customerPhone = phone;
      customerCode = await TP.generateUniqueCustomerCode();
    }

    const tk = TP.todayKey();
    const todayInvoices = S.sales.filter(s => (s.invoiceNo||'').includes('-' + tk + '-'));
    const maxSeq = todayInvoices.reduce((m, s) => Math.max(m, parseInt((s.invoiceNo||'').split('-').pop(), 10) || 0), 0);
    const invoiceNo = `INV-${tk}-${String(maxSeq + 1).padStart(4, '0')}`;

    const batch = TP.db.batch();
    const saleRef = shopRef.collection('sales').doc();

    for (const it of S.cart) {
      const p = S.products.find(x => x.id === it.productId);
      if (p) batch.update(shopRef.collection('products').doc(p.id), { stockQty: (+p.stockQty||0) - it.qty });
    }

    if (newCustomerRef) {
      batch.set(newCustomerRef, {
        name: customerName, phone: customerPhone, address: '',
        due: due, loyaltyPoints: 0,
        customerCode: customerCode,
        createdAt: TP.FV.serverTimestamp(),
      });
      TP.registerCustomerCode(customerCode, S.shopId, customerId, customerPhone, customerName, batch);
    } else if (customerId && due > 0) {
      const c = S.customers.find(x => x.id === customerId);
      if (c) batch.update(shopRef.collection('customers').doc(c.id), { due: (+c.due||0) + due });
    }

    batch.set(saleRef, {
      invoiceNo, customerId, customerName, customerPhone, customerCode,
      salesmanId: S.profile.uid, salesmanName: S.profile.name,
      type: S.saleType, items: S.cart.map(it => ({...it})),
      subtotal, discount, total, paid, due,
      paymentMethod: method,
      splitPayments: splitPayments,
      pointsUsed: pointsUsed,
      saleDate: TP.FV.serverTimestamp(),
    });

    await batch.commit();

    const sale = {
      id: saleRef.id, invoiceNo, customerId, customerName, customerPhone, customerCode,
      salesmanId: S.profile.uid, salesmanName: S.profile.name,
      type: S.saleType, items: S.cart.map(it => ({...it})),
      subtotal, discount, total, paid, due,
      paymentMethod: method, splitPayments, pointsUsed,
      saleDate: new Date(),
    };

    // Deduct used points
    if (pointsUsed > 0 && customerId) {
      const c = S.customers.find(x => x.id === customerId);
      if (c) {
        const newBal = Math.max(0, (+c.loyaltyPoints || 0) - pointsUsed);
        await shopRef.collection('customers').doc(c.id).update({ loyaltyPoints: newBal });
        await shopRef.collection('loyaltyTransactions').add({
          customerId, customerName,
          points: -pointsUsed, type: 'redeem',
          invoiceNo, timestamp: TP.FV.serverTimestamp(),
        });
      }
      window._pointsToRedeem = null;
    }

    // Earn points
    const pointsEarned = TP.calculateLoyaltyEarn(total);
    if (customerId && pointsEarned > 0) {
      try {
        const c = S.customers.find(x => x.id === customerId);
        if (c) {
          const currentPts = (+c.loyaltyPoints || 0) - pointsUsed;
          await shopRef.collection('customers').doc(c.id).update({
            loyaltyPoints: currentPts + pointsEarned
          });
          await shopRef.collection('loyaltyTransactions').add({
            customerId, customerName, points: pointsEarned, type: 'earn',
            invoiceNo, timestamp: TP.FV.serverTimestamp(),
          });
        }
      } catch (e) { console.warn('loyalty:', e); }
    }

    // Commission
    const commRate = +S.profile.commissionRate || 0;
    if (commRate > 0) {
      const comm = TP.calculateCommission(total, commRate);
      await shopRef.collection('sales').doc(saleRef.id).update({
        commissionAmount: comm, commissionRate: commRate
      });
    }

    TP.logActivity(S.shopId, S.profile.uid, S.profile.name, 'SALE', `${invoiceNo} · ₹${total}`);

    try {
      await shopRef.collection('attendance').add({
        userId: S.profile.uid, userName: S.profile.name, role: 'salesman',
        action: 'SALE', timestamp: TP.FV.serverTimestamp(),
        meta: { invoiceNo, total },
      });
    } catch (e) {}

    S.cart = [];
    closeModal('cartModal');
    setTimeout(() => showInvoice(sale), 200);
    TP.toast('Sale completed!', 'success');
  } catch (err) {
    console.error(err);
    TP.toast(err.message || 'Sale failed', 'error');
    btn.disabled = false; btn.textContent = '✓ Complete Sale';
  }
}

        <div style="font-size:48px;margin-bottom:6px">⭐</div>
        <h3 style="font-weight:800;font-size:20px;margin:0 0 4px">Points Payment Sent</h3>
        <p style="color:#94a3b8;font-size:12px;margin:0 0 16px">Request sent to customer's portal</p>

        <div style="background:linear-gradient(135deg,#a855f7,#2563eb);color:#fff;border-radius:16px;padding:16px;margin-bottom:14px">
          <div style="font-size:11px;opacity:.85">Customer</div>
          <div style="font-size:20px;font-weight:800">${TP.esc(c.name)}</div>
          <div style="font-size:11px;opacity:.85;margin-top:6px">Bill: ₹${total.toFixed(2)} · Max: ${maxUsable} pts</div>
        </div>

        <div id="_pqrStatus" style="background:#312e81;border:1px solid #6366f1;border-radius:12px;padding:14px;font-size:13px;color:#c7d2fe;font-weight:600">
          <div style="font-size:24px;margin-bottom:6px" class="spin">⏳</div>
          Waiting for customer to confirm...
          <div style="font-size:10px;opacity:.75;margin-top:6px;font-weight:400">Customer must have their portal open</div>
        </div>

        <div style="margin-top:14px;background:#0f172a;border-radius:10px;padding:10px;font-size:10px;color:#64748b;text-align:left;line-height:1.6">
          <b style="color:#94a3b8">Fallback:</b> If customer's portal isn't open, they can scan QR below.
        </div>

        <div id="_pqrFallback" style="margin-top:8px">
          <button id="_showQRBtn" style="width:100%;background:#334155;color:#cbd5e1;border:none;border-radius:10px;padding:10px;font-weight:600;font-size:12px;font-family:inherit;cursor:pointer">
            📱 Show QR (backup)
          </button>
          <div id="_qrWrap" style="display:none;margin-top:10px">
            <div style="background:#fff;padding:10px;border-radius:12px;display:inline-block">
              <img id="_qrImg" style="width:200px;height:200px;display:block">
            </div>
          </div>
        </div>

        <button id="_pqrCancel" style="width:100%;background:#7f1d1d;color:#fecaca;padding:13px;border:none;border-radius:12px;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer;margin-top:14px">
          Cancel Request
        </button>
      </div>`;
    document.body.appendChild(modal);

    // Show QR fallback
    try {
      const qr = await TP.generateQRDataURL(payURL, 400);
      document.getElementById('_showQRBtn').onclick = () => {
        const wrap = document.getElementById('_qrWrap');
        if (wrap.style.display === 'none') {
          document.getElementById('_qrImg').src = qr;
          wrap.style.display = 'block';
          document.getElementById('_showQRBtn').textContent = '🔽 Hide QR';
        } else {
          wrap.style.display = 'none';
          document.getElementById('_showQRBtn').textContent = '📱 Show QR (backup)';
        }
      };
    } catch (e) {
      document.getElementById('_showQRBtn').style.display = 'none';
    }

    const unsub = TP.watchPointsRequest(requestId, (d) => {
      if (!d) return;
      const statusEl = document.getElementById('_pqrStatus');

      if (d.status === 'confirmed') {
        const result = d.pointsUsed || 0;
        statusEl.style.background = '#14532d';
        statusEl.style.color = '#86efac';
        statusEl.style.borderColor = '#22c55e';
        statusEl.innerHTML = '<div style="font-size:32px;margin-bottom:6px">✅</div>Customer confirmed <b>' + result + ' points</b>!';
        setTimeout(() => {
          try { unsub(); } catch(e){}
          modal.remove();
          window._pointsToRedeem = result;
          document.getElementById('paidInput').value = result.toFixed(2);
          updateSummary();
          TP.toast('⭐ ' + result + ' points confirmed', 'success');
        }, 900);
      } else if (d.status === 'cancelled') {
        statusEl.style.background = '#7f1d1d';
        statusEl.style.color = '#fecaca';
        statusEl.style.borderColor = '#ef4444';
        statusEl.innerHTML = '<div style="font-size:32px;margin-bottom:6px">❌</div>Customer cancelled';
        setTimeout(() => {
          try { unsub(); } catch(e){}
          modal.remove();
          document.getElementById('payMethod').value = 'cash';
          updateSummary();
        }, 900);
      } else if (d.status === 'expired') {
        statusEl.style.background = '#78350f';
        statusEl.style.color = '#fde68a';
        statusEl.style.borderColor = '#f59e0b';
        statusEl.innerHTML = '<div style="font-size:32px;margin-bottom:6px">⏰</div>Request expired';
        setTimeout(() => {
          try { unsub(); } catch(e){}
          modal.remove();
          document.getElementById('payMethod').value = 'cash';
          updateSummary();
        }, 900);
      }
    });

    document.getElementById('_pqrCancel').onclick = async () => {
      if (!confirm('Cancel this points request?')) return;
      try { await TP.cancelPointsRequest(requestId); } catch (e) {}
      try { unsub(); } catch(e){}
      modal.remove();
      document.getElementById('payMethod').value = 'cash';
      updateSummary();
    };

  } catch (e) {
    console.error(e);
    TP.toast('Failed: ' + (e.message || ''), 'error');
    document.getElementById('payMethod').value = 'cash';
  }
}

function openSplitPaymentModal() {

  const discount = +((document.getElementById('discountInput')||{}).value || 0);
  const total = Math.max(0, subtotal - discount);
  const old = document.getElementById('_splitModal');
  if (old) old.remove();
  const modal = document.createElement('div');
  modal.id = '_splitModal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;font-family:Inter,sans-serif';
  modal.innerHTML = `
    <div style="background:#fff;border-radius:22px;max-width:420px;width:100%;padding:22px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="font-weight:800;font-size:17px;margin:0">💳 Split Payment</h3>
        <button id="_splitClose" style="background:#f3f4f6;border:none;width:32px;height:32px;border-radius:8px;font-size:18px;cursor:pointer">×</button>
      </div>
      <div style="background:#f0fdf4;border-radius:12px;padding:12px;margin-bottom:12px;text-align:center">
        <div style="font-size:11px;color:#6b7280">Total</div>
        <div style="font-size:24px;font-weight:800;color:#16a34a">${TP.money(total)}</div>
      </div>
      <label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">Payment 1</label>
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <select id="_sp1m" style="flex:1;padding:10px;border:2px solid #e5e7eb;border-radius:10px;font-family:inherit">
          <option value="cash">💵 Cash</option>
          <option value="upi">💳 UPI</option>
          <option value="bkash">📱 bKash</option>
          <option value="card">💳 Card</option>
          <option value="bank">🏦 Bank</option>
        </select>
        <input id="_sp1a" type="number" min="0" step="1" placeholder="Amount" style="flex:1;padding:10px;border:2px solid #e5e7eb;border-radius:10px;font-family:inherit">
      </div>
      <label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">Payment 2 (optional)</label>
      <div style="display:flex;gap:6px;margin-bottom:12px">
        <select id="_sp2m" style="flex:1;padding:10px;border:2px solid #e5e7eb;border-radius:10px;font-family:inherit">
          <option value="">-- None --</option>
          <option value="cash">💵 Cash</option>
          <option value="upi">💳 UPI</option>
          <option value="bkash">📱 bKash</option>
          <option value="card">💳 Card</option>
          <option value="bank">🏦 Bank</option>
        </select>
        <input id="_sp2a" type="number" min="0" step="1" placeholder="Amount" style="flex:1;padding:10px;border:2px solid #e5e7eb;border-radius:10px;font-family:inherit">
      </div>
      <div id="_splitSummary" style="background:#f9fafb;border-radius:10px;padding:10px;font-size:12px;margin-bottom:12px"></div>
      <button id="_splitApply" style="width:100%;background:#7c3aed;color:#fff;border:none;border-radius:12px;padding:14px;font-weight:700;font-size:15px;cursor:pointer">Apply Split</button>
    </div>`;
  document.body.appendChild(modal);
  const updateSplitSummary = () => {
    const a1 = +document.getElementById('_sp1a').value || 0;
    const a2 = +document.getElementById('_sp2a').value || 0;
    const paid = a1 + a2;
    const due = Math.max(0, total - paid);
    const change = Math.max(0, paid - total);
    document.getElementById('_splitSummary').innerHTML = `
      <div style="display:flex;justify-content:space-between"><span>Paid:</span><b>₹${paid.toFixed(2)}</b></div>
      <div style="display:flex;justify-content:space-between;color:#dc2626"><span>Due:</span><b>₹${due.toFixed(2)}</b></div>
      ${change>0?`<div style="display:flex;justify-content:space-between;color:#16a34a"><span>Change:</span><b>₹${change.toFixed(2)}</b></div>`:''}
    `;
  };
  document.getElementById('_sp1a').addEventListener('input', updateSplitSummary);
  document.getElementById('_sp2a').addEventListener('input', updateSplitSummary);
  updateSplitSummary();
  document.getElementById('_splitClose').onclick = () => modal.remove();
  document.getElementById('_splitApply').onclick = () => {
    const a1 = +document.getElementById('_sp1a').value || 0;
    const a2 = +document.getElementById('_sp2a').value || 0;
    const m1 = document.getElementById('_sp1m').value;
    const m2 = document.getElementById('_sp2m').value;
    const paid = a1 + a2;
    if (paid <= 0) { TP.toast('Enter payment amount', 'error'); return; }
    if (paid > total) { TP.toast('Paid exceeds total', 'error'); return; }
    const payments = [];
    if (a1 > 0) payments.push({ method: m1, amount: a1 });
    if (a2 > 0 && m2) payments.push({ method: m2, amount: a2 });
    window._splitPayments = payments;
    document.getElementById('paidInput').value = paid.toFixed(2);
    modal.remove();
    updateSummary();
    TP.toast('Split applied · ' + payments.length + ' payments', 'success');
  };
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
}

function printInvoice(sale, format) {
  const frame = document.getElementById('printFrame');
  const doc = frame.contentDocument || frame.contentWindow.document;
  doc.open(); doc.write(invoiceDoc(sale, format)); doc.close();
  setTimeout(() => { try { frame.contentWindow.focus(); frame.contentWindow.print(); } catch { TP.toast('Print failed', 'error'); } }, 400);
}

function renderScannerSessionBox() {
  const box = document.getElementById('scannerSessionBox');
  if (!box) return;
  if (!S.scannerSessionId) {
    box.innerHTML = `
      <div class="bg-green-50 border-2 border-dashed border-green-300 rounded-xl p-3 mb-3 text-center">
        <div class="text-3xl mb-1">📱</div>
        <div class="text-xs text-gray-600">No scanner connected</div>
      </div>
      <button id="btnStartScanner" class="w-full bg-green-600 text-white py-3.5 rounded-xl font-semibold shadow-lg active:scale-[.98]">📷 Connect Scanner Device</button>`;
    document.getElementById('btnStartScanner').addEventListener('click', startScannerSession);
    return;
  }
  box.innerHTML = `
    <div class="bg-green-50 border border-green-300 rounded-xl p-3 mb-3">
      <div class="flex items-center gap-2 mb-2"><span class="w-2.5 h-2.5 rounded-full bg-green-500 pulse"></span>
        <span class="font-bold text-sm text-green-700">Session Active</span></div>
      <div class="text-[11px] text-gray-600 font-mono break-all mb-2">${TP.esc(S.scannerSessionId)}</div>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <button id="btnShowQR" class="bg-blue-600 text-white py-3 rounded-xl font-semibold text-sm active:scale-95">📱 Show QR</button>
      <button id="btnStopScanner" class="bg-red-50 text-red-600 py-3 rounded-xl font-semibold text-sm active:scale-95">⛔ Disconnect</button>
    </div>`;
  document.getElementById('btnShowQR').addEventListener('click', () => showSessionQR(S.scannerSessionId));
  document.getElementById('btnStopScanner').addEventListener('click', stopScannerSession);
}

async function startScannerSession() {
  try {
    TP.toast('Generating QR...', 'info');
    const sessionId = await TP.createScannerSession(S.shopId, S.profile.uid, S.profile.name, S.profile.shop?.shopName || '');
    S.scannerSessionId = sessionId;
    localStorage.setItem('tp_scanner_session', JSON.stringify({ sessionId, salesmanId: S.profile.uid }));
    setupScannerScanListener(sessionId);
    renderScannerSessionBox();
    showSessionQR(sessionId);
    TP.toast('QR ready', 'success');
  } catch (e) { console.error(e); TP.toast('Failed: ' + (e.message || ''), 'error'); }
}

async function stopScannerSession() {
  if (!S.scannerSessionId) return;
  if (!await TP.askConfirm('Disconnect scanner?')) return;
  const sid = S.scannerSessionId;
  S.scannerSessionId = null;
  localStorage.removeItem('tp_scanner_session');
  if (S.scannerUnsub) { try { S.scannerUnsub(); } catch {} S.scannerUnsub = null; }
  await TP.deleteScannerSession(sid);
  renderScannerSessionBox();
  TP.toast('Disconnected', 'success');
}

async function showSessionQR(sessionId) {
  const url = TP.buildScannerURL(sessionId);
  const old = document.getElementById('_scannerQRModal');
  if (old) old.remove();
  const modal = document.createElement('div');
  modal.id = '_scannerQRModal';
  modal.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;font-family:Inter,sans-serif;overflow-y:auto`;
  modal.innerHTML = `
    <div style="background:#fff;border-radius:22px;max-width:420px;width:100%;padding:22px;text-align:center">
      <div style="font-size:38px;margin-bottom:4px">📱</div>
      <h3 style="font-weight:800;font-size:18px;margin:0 0 4px">Connect Scanner</h3>
      <p style="color:#6b7280;font-size:12px;margin:0 0 14px">Scan QR with another phone</p>
      <div id="_sqrLoading" style="padding:30px;color:#6b7280">Generating QR...</div>
      <div id="_sqrWrap" style="display:none">
        <div style="background:#fff;padding:10px;border-radius:12px;display:inline-block;border:2px solid #16a34a">
          <img id="_sqrImg" style="width:240px;height:240px;display:block">
        </div>
        <div id="_sqrStatus" style="margin-top:12px;background:#f0fdf4;border:1px solid #86efac;border-radius:10px;padding:8px;font-size:12px;color:#15803d;font-weight:600">⏳ Waiting...</div>
      </div>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button id="_sqrCopy" style="flex:1;background:#2563eb;color:#fff;padding:11px;border:none;border-radius:10px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer">📋 Copy URL</button>
        <button id="_sqrClose" style="flex:1;background:#f3f4f6;color:#374151;padding:11px;border:none;border-radius:10px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer">Close</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  try {
    const dataURL = await TP.generateQRDataURL(url, 600);
    document.getElementById('_sqrLoading').style.display = 'none';
    document.getElementById('_sqrWrap').style.display = '';
    document.getElementById('_sqrImg').src = dataURL;
  } catch (e) { document.getElementById('_sqrLoading').textContent = '⚠️ QR failed'; }
  const unsub = TP.db.collection('scannerSessions').doc(sessionId).onSnapshot(snap => {
    if (!snap.exists) { unsub(); modal.remove(); return; }
    const d = snap.data();
    const el = document.getElementById('_sqrStatus');
    if (el && d.scannerConnected) { el.style.background = '#dcfce7'; el.style.color = '#15803d'; el.innerHTML = '✅ Scanner connected!'; }
  });
  document.getElementById('_sqrCopy').onclick = async () => { await TP.copyText(url); TP.toast('Copied', 'success'); };
  document.getElementById('_sqrClose').onclick = () => { unsub(); modal.remove(); };
  modal.addEventListener('click', e => { if (e.target === modal) { unsub(); modal.remove(); } });
}

function setupScannerScanListener(sessionId) {
  if (S.scannerUnsub) { try { S.scannerUnsub(); } catch {} S.scannerUnsub = null; }
  S.scannerUnsub = TP.db.collection('scannerSessions').doc(sessionId).collection('scans')
    .where('processed', '==', false).onSnapshot(snap => {
      snap.docChanges().forEach(change => {
        if (change.type !== 'added') return;
        const data = change.doc.data();
        const code = String(data.barcode || '').trim();
        if (!code) return;
        const product = S.products.find(p => String(p.barcode || '').trim() === code);
        if (product) {
          if ((+product.stockQty || 0) <= 0) TP.toast('📱 ' + product.name + ' — Out of stock!', 'error');
          else { addToCart(product.id); TP.toast('📱 ' + product.name + ' added', 'success'); if (S.currentPage !== 'pos') goTo('pos'); }
        } else TP.toast('📱 Barcode not found: ' + code, 'error');
        change.doc.ref.delete().catch(() => {});
      });
    }, err => console.error('scan listener:', err));
}

async function restoreScannerSession() {
  try {
    const raw = localStorage.getItem('tp_scanner_session');
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s.salesmanId !== S.profile.uid) { localStorage.removeItem('tp_scanner_session'); return; }
    const doc = await TP.db.collection('scannerSessions').doc(s.sessionId).get();
    if (!doc.exists) { localStorage.removeItem('tp_scanner_session'); return; }
    S.scannerSessionId = s.sessionId;
    setupScannerScanListener(s.sessionId);
  } catch (e) { console.error(e); }
}

/* ═══════════════════════════════════════════════
   PAYMENT DEVICE
   ═══════════════════════════════════════════════ */
function renderPaymentDeviceBox() {
  const box = document.getElementById('paymentDeviceBox');
  if (!box) return;
  const st = S.profile.shop.settings || {};
  if (!st.upiId) {
    box.innerHTML = `<div class="bg-orange-50 border border-orange-200 rounded-xl p-3 text-xs text-orange-800">⚠️ Admin has not set UPI ID yet</div>`;
    return;
  }
  if (!S.paymentSessionId) {
    box.innerHTML = `
      <div class="bg-green-50 border-2 border-dashed border-green-300 rounded-xl p-3 mb-3 text-center">
        <div class="text-3xl mb-1">💳</div>
        <div class="text-xs text-gray-600">No payment device connected</div>
        <div class="text-[10px] text-gray-400 mt-1">UPI: ${TP.esc(st.upiId)}</div>
      </div>
      <button id="btnStartPayment" class="w-full bg-green-600 text-white py-3.5 rounded-xl font-semibold shadow-lg active:scale-[.98]">📷 Connect Payment Device</button>`;
    document.getElementById('btnStartPayment').addEventListener('click', startPaymentDevice);
    return;
  }
  box.innerHTML = `
    <div class="bg-green-50 border border-green-300 rounded-xl p-3 mb-3">
      <div class="flex items-center gap-2 mb-2"><span class="w-2.5 h-2.5 rounded-full bg-green-500 pulse"></span>
        <span class="font-bold text-sm text-green-700">Session Active</span></div>
      <div class="text-[11px] text-gray-600 font-mono break-all mb-2">${TP.esc(S.paymentSessionId)}</div>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <button id="btnShowPayQR" class="bg-blue-600 text-white py-3 rounded-xl font-semibold text-sm active:scale-95">📱 Show QR</button>
      <button id="btnStopPayment" class="bg-red-50 text-red-600 py-3 rounded-xl font-semibold text-sm active:scale-95">⛔ Disconnect</button>
    </div>`;
  document.getElementById('btnShowPayQR').addEventListener('click', () => showPaymentQR(S.paymentSessionId));
  document.getElementById('btnStopPayment').addEventListener('click', stopPaymentDevice);
}

async function startPaymentDevice() {
  try {
    const st = S.profile.shop.settings || {};
    if (!st.upiId) { TP.toast('Admin must set UPI ID first', 'error'); return; }
    TP.toast('Generating QR...', 'info');
    const sessionId = await TP.createPaymentSession(S.shopId, S.profile.uid, S.profile.name,
      st.shopName || S.profile.shop.shopName, st.upiId, st.upiName || '');
    S.paymentSessionId = sessionId;
    localStorage.setItem('tp_payment_session', JSON.stringify({ sessionId, salesmanId: S.profile.uid }));
    renderPaymentDeviceBox();
    showPaymentQR(sessionId);
    TP.toast('Payment device ready', 'success');
  } catch (e) { console.error(e); TP.toast('Failed: ' + e.message, 'error'); }
}

async function stopPaymentDevice() {
  if (!S.paymentSessionId) return;
  if (!await TP.askConfirm('Disconnect payment device?')) return;
  const sid = S.paymentSessionId;
  S.paymentSessionId = null;
  localStorage.removeItem('tp_payment_session');
  await TP.deletePaymentSession(sid);
  renderPaymentDeviceBox();
  TP.toast('Disconnected', 'success');
}

async function showPaymentQR(sessionId) {
  const url = TP.buildPaymentURL(sessionId);
  const old = document.getElementById('_payQRModal');
  if (old) old.remove();
  const modal = document.createElement('div');
  modal.id = '_payQRModal';
  modal.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;font-family:Inter,sans-serif;overflow-y:auto`;
  modal.innerHTML = `
    <div style="background:#fff;border-radius:22px;max-width:420px;width:100%;padding:22px;text-align:center">
      <div style="font-size:38px;margin-bottom:4px">💳</div>
      <h3 style="font-weight:800;font-size:18px;margin:0 0 4px">Connect Payment Device</h3>
      <p style="color:#6b7280;font-size:12px;margin:0 0 14px">Scan QR with another device</p>
      <div id="_payQRLoad" style="padding:30px;color:#6b7280">Generating QR...</div>
      <div id="_payQRWrap" style="display:none">
        <div style="background:#fff;padding:10px;border-radius:12px;display:inline-block;border:2px solid #16a34a">
          <img id="_payQRImg" style="width:240px;height:240px;display:block">
        </div>
        <div id="_payQRStatus" style="margin-top:12px;background:#f0fdf4;border:1px solid #86efac;border-radius:10px;padding:8px;font-size:12px;color:#15803d;font-weight:600">⏳ Waiting for device...</div>
      </div>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button id="_payQRCopy" style="flex:1;background:#2563eb;color:#fff;padding:11px;border:none;border-radius:10px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer">📋 Copy URL</button>
        <button id="_payQRClose" style="flex:1;background:#f3f4f6;color:#374151;padding:11px;border:none;border-radius:10px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer">Close</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  try {
    const qr = await TP.generateQRDataURL(url, 600);
    document.getElementById('_payQRLoad').style.display = 'none';
    document.getElementById('_payQRWrap').style.display = '';
    document.getElementById('_payQRImg').src = qr;
  } catch (e) { document.getElementById('_payQRLoad').textContent = '⚠️ QR failed'; }
  const unsub = TP.db.collection('paymentSessions').doc(sessionId).onSnapshot(snap => {
    if (!snap.exists) { unsub(); modal.remove(); return; }
    const d = snap.data();
    const el = document.getElementById('_payQRStatus');
    if (el && d.deviceConnected) { el.style.background = '#dcfce7'; el.style.color = '#15803d'; el.innerHTML = '✅ Device connected!'; }
  });
  document.getElementById('_payQRCopy').onclick = async () => { await TP.copyText(url); TP.toast('Copied', 'success'); };
  document.getElementById('_payQRClose').onclick = () => { unsub(); modal.remove(); };
  modal.addEventListener('click', e => { if (e.target === modal) { unsub(); modal.remove(); } });
}

async function restorePaymentSession() {
  try {
    const raw = localStorage.getItem('tp_payment_session');
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s.salesmanId !== S.profile.uid) { localStorage.removeItem('tp_payment_session'); return; }
    const doc = await TP.db.collection('paymentSessions').doc(s.sessionId).get();
    if (!doc.exists) { localStorage.removeItem('tp_payment_session'); return; }
    S.paymentSessionId = s.sessionId;
  } catch (e) { console.error(e); }
}

window.goTo = goTo;
</script>
