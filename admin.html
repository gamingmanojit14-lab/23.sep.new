      <button id="btnStopScanner" class="bg-red-50 text-red-600 py-3 rounded-xl font-semibold text-sm active:scale-95">⛔ Disconnect</button>
    </div>`;
  document.getElementById('btnShowQR').addEventListener('click', () => showSessionQR(A.scannerSessionId));
  document.getElementById('btnStopScanner').addEventListener('click', stopScannerSession);
}

async function startScannerSession() {
  try {
    TP.toast('Generating QR...', 'info');
    const sessionId = await TP.createScannerSession(A.shopId, A.profile.uid, A.profile.name, A.profile.shop?.shopName || '');
    A.scannerSessionId = sessionId;
    localStorage.setItem('tp_scanner_session', JSON.stringify({ sessionId, salesmanId: A.profile.uid }));
    setupScannerScanListener(sessionId);
    renderScannerSessionBox();
    showSessionQR(sessionId);
    TP.toast('QR ready', 'success');
  } catch (e) { console.error(e); TP.toast('Failed: ' + (e.message || ''), 'error'); }
}

async function stopScannerSession() {
  if (!A.scannerSessionId) return;
  if (!await TP.askConfirm('Disconnect scanner?')) return;
  const sid = A.scannerSessionId;
  A.scannerSessionId = null;
  localStorage.removeItem('tp_scanner_session');
  if (A.scannerUnsub) { try { A.scannerUnsub(); } catch {} A.scannerUnsub = null; }
  await TP.deleteScannerSession(sid);
  renderScannerSessionBox();
  TP.toast('Disconnected', 'success');
}

async function showSessionQR(sessionId) {
  const url = TP.buildScannerURL(sessionId);
  const old = document.getElementById('_scannerQRModal');
  if (old) old.remove();
  const modal = document.createElement('div');
  modal.id = '_scannerQRModal';
  modal.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;font-family:Inter,sans-serif;overflow-y:auto`;
  modal.innerHTML = `
    <div style="background:#fff;border-radius:22px;max-width:420px;width:100%;padding:22px;text-align:center">
      <div style="font-size:38px;margin-bottom:4px">📱</div>
      <h3 style="font-weight:800;font-size:18px;margin:0 0 4px">Connect Scanner</h3>
      <p style="color:#6b7280;font-size:12px;margin:0 0 14px">Scan QR with another phone</p>
      <div id="_sqrLoading" style="padding:30px;color:#6b7280">Generating QR...</div>
      <div id="_sqrWrap" style="display:none">
        <div style="background:#fff;padding:10px;border-radius:12px;display:inline-block;border:2px solid #2563eb">
          <img id="_sqrImg" style="width:240px;height:240px;display:block">
        </div>
        <div id="_sqrStatus" style="margin-top:12px;background:#eff6ff;border:1px solid #93c5fd;border-radius:10px;padding:8px;font-size:12px;color:#1e40af;font-weight:600">⏳ Waiting...</div>
      </div>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button id="_sqrCopy" style="flex:1;background:#2563eb;color:#fff;padding:11px;border:none;border-radius:10px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer">📋 Copy URL</button>
        <button id="_sqrClose" style="flex:1;background:#f3f4f6;color:#374151;padding:11px;border:none;border-radius:10px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer">Close</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  try {
    const dataURL = await TP.generateQRDataURL(url, 600);
    document.getElementById('_sqrLoading').style.display = 'none';
    document.getElementById('_sqrWrap').style.display = '';
    document.getElementById('_sqrImg').src = dataURL;
  } catch (e) { document.getElementById('_sqrLoading').textContent = '⚠️ QR failed'; }
  const unsub = TP.db.collection('scannerSessions').doc(sessionId).onSnapshot(snap => {
    if (!snap.exists) { unsub(); modal.remove(); return; }
    const d = snap.data();
    const el = document.getElementById('_sqrStatus');
    if (el && d.scannerConnected) { el.style.background = '#dbeafe'; el.style.color = '#1e40af'; el.innerHTML = '✅ Scanner connected!'; }
  });
  document.getElementById('_sqrCopy').onclick = async () => { await TP.copyText(url); TP.toast('Copied', 'success'); };
  document.getElementById('_sqrClose').onclick = () => { unsub(); modal.remove(); };
  modal.addEventListener('click', e => { if (e.target === modal) { unsub(); modal.remove(); } });
}

function setupScannerScanListener(sessionId) {
  if (A.scannerUnsub) { try { A.scannerUnsub(); } catch {} A.scannerUnsub = null; }
  A.scannerUnsub = TP.db.collection('scannerSessions').doc(sessionId).collection('scans')
    .where('processed', '==', false).onSnapshot(snap => {
      snap.docChanges().forEach(change => {
        if (change.type !== 'added') return;
        const data = change.doc.data();
        const code = String(data.barcode || '').trim();
        if (!code) return;
        const product = A.products.find(p => String(p.barcode || '').trim() === code);
        if (product) {
          if ((+product.stockQty || 0) <= 0) TP.toast('📱 ' + product.name + ' — Out of stock!', 'error');
          else { addToCart(product.id); TP.toast('📱 ' + product.name + ' added', 'success'); if (A.currentPage !== 'pos') goTo('pos'); }
        } else TP.toast('📱 Barcode not found: ' + code, 'error');
        change.doc.ref.delete().catch(() => {});
      });
    }, err => console.error('scan listener:', err));
}

async function restoreScannerSession() {
  try {
    const raw = localStorage.getItem('tp_scanner_session');
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s.salesmanId !== A.profile.uid) { localStorage.removeItem('tp_scanner_session'); return; }
    const doc = await TP.db.collection('scannerSessions').doc(s.sessionId).get();
    if (!doc.exists) { localStorage.removeItem('tp_scanner_session'); return; }
    A.scannerSessionId = s.sessionId;
    setupScannerScanListener(s.sessionId);
  } catch (e) { console.error(e); }
}

/* ============================================================
   PAYMENT DEVICE
   ============================================================ */
function renderPaymentDeviceBox() {
  const box = document.getElementById('paymentDeviceBox');
  if (!box) return;
  const s = A.profile.shop.settings || {};
  if (!s.upiId) {
    box.innerHTML = `<div class="bg-orange-50 border border-orange-200 rounded-xl p-3 text-xs text-orange-800">⚠️ Set UPI ID first</div>`;
    return;
  }
  if (!A.paymentSessionId) {
    box.innerHTML = `
      <div class="bg-blue-50 border-2 border-dashed border-blue-300 rounded-xl p-3 mb-3 text-center">
        <div class="text-3xl mb-1">💳</div>
        <div class="text-xs text-gray-600">No payment device connected</div>
        <div class="text-[10px] text-gray-400 mt-1">UPI: ${TP.esc(s.upiId)}</div>
      </div>
      <button id="btnStartPayment" class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-semibold shadow-lg active:scale-[.98]">📷 Connect Payment Device</button>`;
    document.getElementById('btnStartPayment').addEventListener('click', startPaymentDevice);
    return;
  }
  box.innerHTML = `
    <div class="bg-blue-50 border border-blue-300 rounded-xl p-3 mb-3">
      <div class="flex items-center gap-2 mb-2"><span class="w-2.5 h-2.5 rounded-full bg-blue-500 pulse"></span>
        <span class="font-bold text-sm text-blue-700">Session Active</span></div>
      <div class="text-[11px] text-gray-600 font-mono break-all mb-2">${TP.esc(A.paymentSessionId)}</div>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <button id="btnShowPayQR" class="bg-blue-600 text-white py-3 rounded-xl font-semibold text-sm active:scale-95">📱 Show QR</button>
      <button id="btnStopPayment" class="bg-red-50 text-red-600 py-3 rounded-xl font-semibold text-sm active:scale-95">⛔ Disconnect</button>
    </div>`;
  document.getElementById('btnShowPayQR').addEventListener('click', () => showPaymentQR(A.paymentSessionId));
  document.getElementById('btnStopPayment').addEventListener('click', stopPaymentDevice);
}

async function startPaymentDevice() {
  try {
    const s = A.profile.shop.settings || {};
    if (!s.upiId) { TP.toast('Set UPI ID first', 'error'); return; }
    TP.toast('Generating QR...', 'info');
    const sessionId = await TP.createPaymentSession(A.shopId, A.profile.uid, A.profile.name,
      s.shopName || A.profile.shop.shopName, s.upiId, s.upiName || '');
    A.paymentSessionId = sessionId;
    localStorage.setItem('tp_payment_session', JSON.stringify({ sessionId, salesmanId: A.profile.uid }));
    renderPaymentDeviceBox();
    showPaymentQR(sessionId);
    TP.toast('Payment device ready', 'success');
  } catch (e) { console.error(e); TP.toast('Failed: ' + e.message, 'error'); }
}

async function stopPaymentDevice() {
  if (!A.paymentSessionId) return;
  if (!await TP.askConfirm('Disconnect payment device?')) return;
  const sid = A.paymentSessionId;
  A.paymentSessionId = null;
  localStorage.removeItem('tp_payment_session');
  await TP.deletePaymentSession(sid);
  renderPaymentDeviceBox();
  TP.toast('Disconnected', 'success');
}

async function showPaymentQR(sessionId) {
  const url = TP.buildPaymentURL(sessionId);
  const old = document.getElementById('_payQRModal');
  if (old) old.remove();
  const modal = document.createElement('div');
  modal.id = '_payQRModal';
  modal.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;font-family:Inter,sans-serif;overflow-y:auto`;
  modal.innerHTML = `
    <div style="background:#fff;border-radius:22px;max-width:420px;width:100%;padding:22px;text-align:center">
      <div style="font-size:38px;margin-bottom:4px">💳</div>
      <h3 style="font-weight:800;font-size:18px;margin:0 0 4px">Connect Payment Device</h3>
      <p style="color:#6b7280;font-size:12px;margin:0 0 14px">Scan QR with another device</p>
      <div id="_payQRLoad" style="padding:30px;color:#6b7280">Generating QR...</div>
      <div id="_payQRWrap" style="display:none">
        <div style="background:#fff;padding:10px;border-radius:12px;display:inline-block;border:2px solid #2563eb">
          <img id="_payQRImg" style="width:240px;height:240px;display:block">
        </div>
        <div id="_payQRStatus" style="margin-top:12px;background:#eff6ff;border:1px solid #93c5fd;border-radius:10px;padding:8px;font-size:12px;color:#1e40af;font-weight:600">⏳ Waiting for device...</div>
      </div>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button id="_payQRCopy" style="flex:1;background:#2563eb;color:#fff;padding:11px;border:none;border-radius:10px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer">📋 Copy URL</button>
        <button id="_payQRClose" style="flex:1;background:#f3f4f6;color:#374151;padding:11px;border:none;border-radius:10px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer">Close</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  try {
    const qr = await TP.generateQRDataURL(url, 600);
    document.getElementById('_payQRLoad').style.display = 'none';
    document.getElementById('_payQRWrap').style.display = '';
    document.getElementById('_payQRImg').src = qr;
  } catch (e) { document.getElementById('_payQRLoad').textContent = '⚠️ QR failed'; }
  const unsub = TP.db.collection('paymentSessions').doc(sessionId).onSnapshot(snap => {
    if (!snap.exists) { unsub(); modal.remove(); return; }
    const d = snap.data();
    const el = document.getElementById('_payQRStatus');
    if (el && d.deviceConnected) { el.style.background = '#dbeafe'; el.style.color = '#1e40af'; el.innerHTML = '✅ Device connected!'; }
  });
  document.getElementById('_payQRCopy').onclick = async () => { await TP.copyText(url); TP.toast('Copied', 'success'); };
  document.getElementById('_payQRClose').onclick = () => { unsub(); modal.remove(); };
  modal.addEventListener('click', e => { if (e.target === modal) { unsub(); modal.remove(); } });
}

async function restorePaymentSession() {
  try {
    const raw = localStorage.getItem('tp_payment_session');
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s.salesmanId !== A.profile.uid) { localStorage.removeItem('tp_payment_session'); return; }
    const doc = await TP.db.collection('paymentSessions').doc(s.sessionId).get();
    if (!doc.exists) { localStorage.removeItem('tp_payment_session'); return; }
    A.paymentSessionId = s.sessionId;
  } catch (e) { console.error(e); }
}

window.goTo = goTo;
</script>
