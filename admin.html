<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Admin Panel — TextilePOS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<script>
tailwind.config = { theme: { extend: {
  colors: { primary:'#2563eb', success:'#16a34a', danger:'#dc2626', warn:'#f59e0b' },
  fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
}}}
</script>
<style>
  *{ -webkit-tap-highlight-color:transparent; }
  body{ font-family:'Inter',system-ui,sans-serif; }
  input,select,textarea,button{ font-family:inherit; }
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
  .slide-up{animation:slideUp .25s cubic-bezier(.2,.9,.3,1)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .fade-in{animation:fadeIn .2s ease}
  .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .no-spin::-webkit-outer-spin-button,.no-spin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .hide{display:none !important}
  @keyframes scanPulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.4)}50%{box-shadow:0 0 0 8px rgba(37,99,235,0)}}
  .scan-pulse{animation:scanPulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .pulse{animation:pulse 1.5s infinite}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .spin{animation:spin 1.2s linear infinite;display:inline-block}
  /* Dark mode */
  html.dark body { background: #111827 !important; color: #e5e7eb; }
  html.dark .bg-white { background: #1f2937 !important; }
  html.dark .bg-gray-100 { background: #111827 !important; }
  html.dark .bg-gray-50 { background: #1a202c !important; }
  html.dark .text-gray-800, html.dark .text-gray-700 { color: #e5e7eb !important; }
  html.dark .text-gray-500, html.dark .text-gray-600 { color: #9ca3af !important; }
  html.dark .border-gray-200, html.dark .border-gray-100 { border-color: #374151 !important; }
  html.dark input, html.dark select, html.dark textarea { background: #374151 !important; color: #e5e7eb !important; border-color: #4b5563 !important; }
  html.dark .shadow-sm { box-shadow: 0 1px 2px rgba(0,0,0,.5) !important; }
  html.dark .hover\:bg-gray-50:hover { background: #374151 !important; }
</style>
</head>
<body class="bg-gray-100 text-gray-800">

<div id="loadingScreen" class="fixed inset-0 bg-blue-600 flex items-center justify-center z-[999]">
  <div class="text-white text-center">
    <div class="text-6xl mb-3">🧵</div>
    <div class="text-lg font-bold">Loading...</div>
  </div>
</div>

<div id="app" class="hide min-h-screen">
  <header class="fixed top-0 inset-x-0 h-14 bg-blue-600 text-white flex items-center px-2 z-40 shadow-md">
    <button id="menuBtn" class="p-2 w-11 h-11 flex items-center justify-center rounded-lg active:bg-white/20">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <h1 id="pageTitle" class="flex-1 text-lg font-bold ml-1 truncate">POS</h1>
    <div class="text-right leading-tight pr-2">
      <div id="userName" class="text-sm font-semibold truncate max-w-[120px]"></div>
      <div id="userRole" class="text-[10px] opacity-80"></div>
    </div>
  </header>

  <div id="drawerBackdrop" class="hide fixed inset-0 bg-black/60 z-50"></div>
  <aside id="drawer" class="fixed top-0 left-0 bottom-0 w-72 max-w-[85vw] bg-white z-[60] -translate-x-full transition-transform duration-300 shadow-2xl overflow-y-auto">
    <div class="bg-blue-600 text-white p-5">
      <div class="text-3xl mb-2">🧵</div>
      <div id="drawerShop" class="font-bold text-base truncate"></div>
      <div class="mt-1.5 inline-flex items-center gap-1 text-[11px] bg-white/20 px-2 py-1 rounded-md">
        <span>Shop:</span><span id="drawerShopId" class="font-mono font-bold"></span>
      </div>
      <div id="drawerUser" class="text-[11px] opacity-80 mt-1.5"></div>
    </div>
    <nav id="drawerNav" class="p-2"></nav>
  </aside>

  <main class="pt-14 pb-24 min-h-screen">
    <section id="page-pos" class="page"></section>
    <section id="page-dashboard" class="page hide"></section>
    <section id="page-sales" class="page hide"></section>
    <section id="page-products" class="page hide"></section>
    <section id="page-inventory" class="page hide"></section>
    <section id="page-customers" class="page hide"></section>
    <section id="page-salesmen" class="page hide"></section>
    <section id="page-purchases" class="page hide"></section>
    <section id="page-expenses" class="page hide"></section>
    <section id="page-returns" class="page hide"></section>
    <section id="page-shift" class="page hide"></section>
    <section id="page-reports" class="page hide"></section>
    <section id="page-analytics" class="page hide"></section>
    <section id="page-activity" class="page hide"></section>
    <section id="page-attendance" class="page hide"></section>
    <section id="page-campaign" class="page hide"></section>
    <section id="page-settings" class="page hide"></section>
  </main>

  <div id="cartBar" class="hide fixed bottom-[68px] inset-x-0 z-30 px-3 pointer-events-none">
    <button id="openCartBtn" class="w-full pointer-events-auto bg-green-600 text-white rounded-2xl py-3.5 px-5 flex items-center justify-between shadow-2xl active:scale-[.98] transition">
      <span class="text-sm font-semibold">🛒 Cart: <span id="cartCount">0</span></span>
      <span class="font-extrabold text-lg" id="cartTotal">₹0</span>
      <span class="text-sm font-semibold bg-white/20 px-3 py-1 rounded-lg">Checkout →</span>
    </button>
  </div>

  <nav id="bottomNav" class="fixed bottom-0 inset-x-0 h-[68px] bg-white border-t border-gray-200 flex z-30 shadow-[0_-2px_10px_rgba(0,0,0,.05)]"></nav>
</div>

<div id="cartModal" class="hide fixed inset-0 z-[80] bg-black/60 items-end sm:items-center justify-center">
  <div class="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[94vh] flex flex-col slide-up">
    <div class="p-4 border-b flex items-center justify-between flex-shrink-0">
      <h2 class="font-bold text-lg">🛒 Cart</h2>
      <button data-close="cartModal" class="w-9 h-9 rounded-lg hover:bg-gray-100 text-2xl leading-none">×</button>
    </div>
    <div class="flex-1 overflow-y-auto p-4 space-y-2.5" id="cartItems"></div>
    <div class="p-4 border-t bg-gray-50 flex-shrink-0 max-h-[60vh] overflow-y-auto" id="cartCheckout"></div>
  </div>
</div>

<div id="invoiceModal" class="hide fixed inset-0 z-[85] bg-black/70 items-center justify-center p-2">
  <div class="bg-white w-full max-w-2xl rounded-2xl max-h-[96vh] flex flex-col fade-in">
    <div class="p-3 border-b flex items-center justify-between">
      <h2 class="font-bold">🧾 Invoice</h2>
      <button data-close="invoiceModal" class="w-9 h-9 rounded-lg hover:bg-gray-100 text-2xl leading-none">×</button>
    </div>
    <div class="flex-1 overflow-y-auto p-4" id="invoiceBody"></div>
    <div class="p-3 border-t flex gap-2 flex-wrap">
      <button id="printThermal" class="flex-1 min-w-[80px] bg-gray-700 text-white py-3 rounded-xl font-semibold text-sm active:scale-95">🖨 Thermal</button>
      <button id="printA4" class="flex-1 min-w-[80px] bg-blue-600 text-white py-3 rounded-xl font-semibold text-sm active:scale-95">🖨 A4</button>
      <button id="waInvoice" class="flex-1 min-w-[80px] bg-green-600 text-white py-3 rounded-xl font-semibold text-sm active:scale-95">💬 WhatsApp</button>
      <button data-close="invoiceModal" class="flex-1 min-w-[80px] bg-gray-200 py-3 rounded-xl font-semibold text-sm active:scale-95">Close</button>
    </div>
  </div>
</div>

<div id="formModal" class="hide fixed inset-0 z-[88] bg-black/60 items-center justify-center p-3">
  <div class="bg-white rounded-2xl w-full max-w-md max-h-[92vh] flex flex-col fade-in">
    <div class="p-4 border-b flex items-center justify-between">
      <h2 id="formModalTitle" class="font-bold text-lg"></h2>
      <button data-close="formModal" class="w-9 h-9 rounded-lg hover:bg-gray-100 text-2xl leading-none">×</button>
    </div>
    <form id="formModalForm" class="flex flex-col flex-1 overflow-hidden">
      <div id="formModalBody" class="p-4 space-y-3 overflow-y-auto flex-1"></div>
      <div id="formModalFooter" class="p-4 border-t flex gap-2">
        <button type="button" data-close="formModal" class="flex-1 bg-gray-100 py-3 rounded-xl font-semibold">Cancel</button>
        <button type="submit" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-semibold">Save</button>
      </div>
    </form>
  </div>
</div>

<iframe id="printFrame" style="position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;"></iframe>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="common.js"></script>

<script>
/* ============================================================
   ADMIN PANEL STATE
   ============================================================ */
const A = {
  profile: null, shopId: null,
  products: [], customers: [], sales: [], payments: [], users: [],
  expenses: [], purchases: [], returns: [], shifts: [], activityLogs: [], attendance: [],
  cart: [], saleType: 'retail', posSearch: '', posCategory: '',
  custMode: 'walkin', custId: '',
  currentInvoice: null, currentPage: 'pos',
  unsubs: [],
  salesFilter: { salesmanId: '', q: '' },
  reportPeriod: 'today',
  scannerSessionId: null, scannerUnsub: null,
  paymentSessionId: null,
  currentShiftId: null, currentShift: null,
};

/* ── MODAL HELPERS ── */
function openModal(id) { const m = document.getElementById(id); if (m) { m.classList.remove('hide'); m.classList.add('flex'); } }
function closeModal(id) { const m = document.getElementById(id); if (m) { m.classList.add('hide'); m.classList.remove('flex'); } }
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-close]');
  if (btn) closeModal(btn.dataset.close);
});

function openForm(title, fields, values, onSubmit) {
  values = values || {};
  document.getElementById('formModalTitle').textContent = title;
  document.getElementById('formModalBody').innerHTML = fields.map(f => {
    const v = values[f.name] !== undefined ? values[f.name] : (f.default || '');
    const cls = 'w-full px-3.5 py-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none text-base';
    if (f.type === 'select') {
      return `<div><label class="block text-sm font-semibold text-gray-700 mb-1.5">${TP.esc(f.label)}</label>
        <select name="${f.name}" class="${cls}" ${f.required?'required':''}>
          ${f.options.map(o => `<option value="${TP.esc(o.value)}" ${String(o.value)===String(v)?'selected':''}>${TP.esc(o.label)}</option>`).join('')}
        </select></div>`;
    }
    if (f.type === 'textarea') {
      return `<div><label class="block text-sm font-semibold text-gray-700 mb-1.5">${TP.esc(f.label)}</label>
        <textarea name="${f.name}" rows="3" class="${cls}" ${f.required?'required':''}>${TP.esc(v)}</textarea></div>`;
    }
    return `<div><label class="block text-sm font-semibold text-gray-700 mb-1.5">${TP.esc(f.label)}</label>
      <input name="${f.name}" type="${f.type||'text'}" value="${TP.esc(v)}" class="${cls} no-spin"
        ${f.required?'required':''} ${f.step?`step="${f.step}"`:''} ${f.min!==undefined?`min="${f.min}"`:''} ${f.placeholder?`placeholder="${TP.esc(f.placeholder)}"`:''}></div>`;
  }).join('');

  document.getElementById('formModalFooter').style.display = 'flex';
  const form = document.getElementById('formModalForm');
  form.onsubmit = async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    try { await onSubmit(data); closeModal('formModal'); }
    catch (err) { console.error(err); TP.toast(err.message || 'Save failed', 'error'); }
  };
  openModal('formModal');
  setTimeout(() => document.querySelector('#formModalBody input, #formModalBody select')?.focus(), 100);
}

/* ── BOOT ── */
(async function boot() {
  const profile = await TP.requireAuth('admin');
  A.profile = profile;
  A.shopId = profile.shopId;
  await restoreScannerSession();
  await restorePaymentSession();
  await restoreCurrentShift();
  document.getElementById('loadingScreen').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  renderShell();
  setupListeners();
  goTo('pos');
})();

function renderShell() {
  document.getElementById('userName').textContent = A.profile.name;
  document.getElementById('userRole').textContent = 'Admin';
  document.getElementById('drawerShop').textContent = A.profile.shop.shopName;
  document.getElementById('drawerShopId').textContent = A.shopId;
  document.getElementById('drawerUser').textContent = A.profile.name + ' · Admin';
  updateBottomNav();
}

/* ── LISTENERS ── */
function setupListeners() {
  const sid = A.shopId;
  const shopRef = TP.db.collection('shops').doc(sid);

  A.unsubs.push(shopRef.collection('products').onSnapshot(s => {
    A.products = s.docs.map(d => ({ id: d.id, ...d.data() })); renderCurrent();
  }));
  A.unsubs.push(shopRef.collection('customers').onSnapshot(s => {
    A.customers = s.docs.map(d => ({ id: d.id, ...d.data() })); renderCurrent();
  }));
  A.unsubs.push(shopRef.collection('sales').orderBy('saleDate', 'desc').limit(500).onSnapshot(s => {
    A.sales = s.docs.map(d => ({ id: d.id, ...d.data() })); renderCurrent();
  }));
  A.unsubs.push(shopRef.collection('payments').orderBy('paymentDate', 'desc').limit(500).onSnapshot(s => {
    A.payments = s.docs.map(d => ({ id: d.id, ...d.data() }));
  }));
  A.unsubs.push(TP.db.collection('users').where('shopId', '==', sid).onSnapshot(s => {
    A.users = s.docs.map(d => ({ id: d.id, ...d.data() }));
    if (A.currentPage === 'salesmen') renderSalesmen();
  }));
  A.unsubs.push(shopRef.onSnapshot(s => {
    if (s.exists) {
      A.profile.shop = { shopId: sid, ...s.data() };
      renderShell();
      if (A.currentPage === 'settings') renderSettings();
    }
  }));
  A.unsubs.push(shopRef.collection('expenses').orderBy('expenseDate', 'desc').limit(500).onSnapshot(s => {
    A.expenses = s.docs.map(d => ({ id: d.id, ...d.data() }));
    if (A.currentPage === 'expenses') renderExpenses();
  }));
  A.unsubs.push(shopRef.collection('purchases').orderBy('purchaseDate', 'desc').limit(500).onSnapshot(s => {
    A.purchases = s.docs.map(d => ({ id: d.id, ...d.data() }));
    if (A.currentPage === 'purchases') renderPurchases();
  }));
  A.unsubs.push(shopRef.collection('returns').orderBy('returnDate', 'desc').limit(500).onSnapshot(s => {
    A.returns = s.docs.map(d => ({ id: d.id, ...d.data() }));
    if (A.currentPage === 'returns') renderReturns();
  }));
  A.unsubs.push(shopRef.collection('shifts').orderBy('openedAt', 'desc').limit(50).onSnapshot(s => {
    A.shifts = s.docs.map(d => ({ id: d.id, ...d.data() }));
    if (A.currentPage === 'shift') renderShift();
  }));
  A.unsubs.push(shopRef.collection('activityLogs').orderBy('timestamp', 'desc').limit(500).onSnapshot(s => {
    A.activityLogs = s.docs.map(d => ({ id: d.id, ...d.data() }));
    if (A.currentPage === 'activity') renderActivityLog();
  }));
  A.unsubs.push(shopRef.collection('attendance').orderBy('timestamp', 'desc').limit(500).onSnapshot(s => {
    A.attendance = s.docs.map(d => ({ id: d.id, ...d.data() }));
    if (A.currentPage === 'attendance') renderAttendance();
  }));
}

/* ── NAVIGATION ── */
const PAGE_TITLES = {
  pos: 'Point of Sale', dashboard: 'Dashboard', sales: 'All Sales',
  products: 'Products', inventory: 'Inventory', customers: 'Customers',
  salesmen: 'Salesmen', purchases: 'Purchases', expenses: 'Expenses',
  returns: 'Returns', shift: 'Cash Register', reports: 'Reports',
  analytics: 'Analytics', activity: 'Activity Log', attendance: 'Attendance',
  campaign: 'WhatsApp Campaign', settings: 'Settings',
};

function goTo(page) {
  A.currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.add('hide'));
  const el = document.getElementById('page-' + page);
  if (el) el.classList.remove('hide');
  document.getElementById('pageTitle').textContent = PAGE_TITLES[page] || page;
  closeDrawer();
  updateBottomNav();
  renderCurrent();
  window.scrollTo({ top: 0 });
}

function renderCurrent() {
  if (!A.profile) return;
  switch (A.currentPage) {
    case 'pos': renderPOS(); break;
    case 'dashboard': renderDashboard(); break;
    case 'sales': renderSales(); break;
    case 'products': renderProducts(); break;
    case 'inventory': renderInventory(); break;
    case 'customers': renderCustomers(); break;
    case 'salesmen': renderSalesmen(); break;
    case 'purchases': renderPurchases(); break;
    case 'expenses': renderExpenses(); break;
    case 'returns': renderReturns(); break;
    case 'shift': renderShift(); break;
    case 'reports': renderReports(); break;
    case 'analytics': renderAnalytics(); break;
    case 'activity': renderActivityLog(); break;
    case 'attendance': renderAttendance(); break;
    case 'campaign': renderCampaign(); break;
    case 'settings': renderSettings(); break;
  }
  updateCartBar();
}

function updateBottomNav() {
  const items = [
    { p: 'pos', i: '🛒', l: 'POS' },
    { p: 'dashboard', i: '📊', l: 'Dashboard' },
    { p: 'sales', i: '🧾', l: 'Sales' },
    { p: '__menu', i: '☰', l: 'Menu' },
  ];
  document.getElementById('bottomNav').innerHTML = items.map(it => `
    <button data-nav="${it.p}" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-[11px] font-medium transition
      ${A.currentPage === it.p ? 'text-blue-600' : 'text-gray-500'}">
      <span class="text-[22px] leading-none">${it.i}</span>
      <span>${it.l}</span>
    </button>`).join('');
  document.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.nav === '__menu') openDrawer();
    else goTo(b.dataset.nav);
  }));
}

function openDrawer() {
  document.getElementById('drawer').classList.remove('-translate-x-full');
  document.getElementById('drawerBackdrop').classList.remove('hide');
  buildDrawerNav();
}
function closeDrawer() {
  document.getElementById('drawer').classList.add('-translate-x-full');
  document.getElementById('drawerBackdrop').classList.add('hide');
}
document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);
document.getElementById('menuBtn').addEventListener('click', openDrawer);

function buildDrawerNav() {
  const items = [
    { p: 'pos', i: '🛒', l: 'Point of Sale' },
    { p: 'dashboard', i: '📊', l: 'Dashboard' },
    { p: 'sales', i: '🧾', l: 'All Sales' },
    { p: 'products', i: '📦', l: 'Products' },
    { p: 'inventory', i: '🏪', l: 'Inventory' },
    { p: 'customers', i: '🧑‍🤝‍🧑', l: 'Customers' },
    { p: 'salesmen', i: '👥', l: 'Salesmen' },
    { p: 'purchases', i: '📥', l: 'Purchases' },
    { p: 'expenses', i: '💸', l: 'Expenses' },
    { p: 'returns', i: '↩️', l: 'Returns' },
    { p: 'shift', i: '💰', l: 'Cash Register' },
    { p: 'reports', i: '📈', l: 'Reports' },
    { p: 'analytics', i: '📊', l: 'Analytics' },
    { p: 'attendance', i: '📅', l: 'Attendance' },
    { p: 'activity', i: '📜', l: 'Activity Log' },
    { p: 'campaign', i: '📢', l: 'Campaign' },
    { p: 'settings', i: '⚙️', l: 'Settings' },
  ];
  document.getElementById('drawerNav').innerHTML = items.map(it => `
    <button data-dnav="${it.p}" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-left font-medium
      ${A.currentPage === it.p ? 'bg-blue-50 text-blue-600' : 'text-gray-700 hover:bg-gray-50'}">
      <span class="text-xl">${it.i}</span><span>${it.l}</span>
    </button>`).join('') + `
    <div class="border-t my-2"></div>
    <button id="drawerLogout" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-left font-medium text-red-600 hover:bg-red-50">
      <span class="text-xl">🚪</span><span>Logout</span>
    </button>`;
  document.querySelectorAll('[data-dnav]').forEach(b => b.addEventListener('click', () => goTo(b.dataset.dnav)));
  document.getElementById('drawerLogout').addEventListener('click', async () => {
    closeDrawer();
    if (!await TP.askConfirm('Logout from this account?')) return;
    if (A.scannerSessionId) { try { await TP.deleteScannerSession(A.scannerSessionId); } catch {} A.scannerSessionId = null; localStorage.removeItem('tp_scanner_session'); }
    if (A.paymentSessionId) { try { await TP.deletePaymentSession(A.paymentSessionId); } catch {} A.paymentSessionId = null; localStorage.removeItem('tp_payment_session'); }
    await TP.auth.signOut();
  });
}

/* ============================================================
   POS
   ============================================================ */
function renderPOS() {
  const el = document.getElementById('page-pos');
  const cats = [...new Set(A.products.map(p => p.category).filter(Boolean))];
  el.innerHTML = `
    <div class="p-3 space-y-3">
      <div class="flex gap-2">
        <button id="typeRetail" class="flex-1 py-3 rounded-xl font-semibold text-sm transition">🏪 Retail</button>
        <button id="typeWhole" class="flex-1 py-3 rounded-xl font-semibold text-sm transition">🏭 Wholesale</button>
      </div>

      <div class="flex gap-2">
        <div class="relative flex-1 scan-pulse rounded-xl">
          <input id="barcodeInput" type="text" inputmode="numeric" autocomplete="off"
            placeholder="📷 Scan barcode or type..."
            class="w-full px-4 py-4 rounded-xl border-2 border-dashed border-blue-500 bg-blue-50 focus:border-blue-700 focus:bg-white focus:outline-none text-base font-mono pr-12">
          <div class="absolute right-3 top-1/2 -translate-y-1/2 text-[9px] bg-blue-600 text-white px-2 py-1 rounded font-bold pointer-events-none">SCAN</div>
        </div>
        <button id="qrScanBtn" class="px-4 rounded-xl bg-blue-600 text-white font-bold text-2xl active:scale-95 transition" title="QR Scan">📱</button>
      </div>

      <input id="posSearch" type="search" placeholder="🔍 Search product..." value="${TP.esc(A.posSearch)}"
        class="w-full px-4 py-3.5 rounded-xl border-2 border-gray-200 bg-white focus:border-blue-500 focus:outline-none">

      ${cats.length ? `
      <div class="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1">
        <button data-cat="" class="cat-chip flex-shrink-0 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap">All</button>
        ${cats.map(c => `<button data-cat="${TP.esc(c)}" class="cat-chip flex-shrink-0 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap">${TP.esc(c)}</button>`).join('')}
      </div>` : ''}

      <div id="productGrid" class="grid grid-cols-2 gap-3 pb-2"></div>
    </div>`;

  const bcInput = document.getElementById('barcodeInput');
  bcInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); handleBarcodeScan(e.target.value.trim()); e.target.value = ''; }
  });
  setTimeout(() => bcInput.focus(), 200);

  document.getElementById('qrScanBtn').addEventListener('click', () => {
    TP.openQRScanner(code => handleBarcodeScan(String(code).trim()));
  });

  document.getElementById('posSearch').addEventListener('input', e => { A.posSearch = e.target.value; renderProductGrid(); });
  document.getElementById('typeRetail').addEventListener('click', () => { A.saleType = 'retail'; updateTypeButtons(); renderProductGrid(); });
  document.getElementById('typeWhole').addEventListener('click', () => { A.saleType = 'wholesale'; updateTypeButtons(); renderProductGrid(); });
  document.querySelectorAll('.cat-chip').forEach(b => b.addEventListener('click', () => { A.posCategory = b.dataset.cat; renderProductGrid(); }));
  updateTypeButtons();
  renderProductGrid();
}

function handleBarcodeScan(code) {
  if (!code) return;
  const product = A.products.find(p => String(p.barcode || '').trim() === code);
  if (!product) { TP.toast('Barcode not found: ' + code, 'error'); return; }
  if ((+product.stockQty || 0) <= 0) { TP.toast(product.name + ' — Out of stock!', 'error'); return; }
  addToCart(product.id);
  TP.toast('✓ ' + product.name, 'success');
  const bc = document.getElementById('barcodeInput');
  if (bc) bc.focus();
}

function updateTypeButtons() {
  const r = document.getElementById('typeRetail'), w = document.getElementById('typeWhole');
  const on = 'bg-blue-600 text-white shadow-lg', off = 'bg-white text-gray-600 border-2 border-gray-200';
  r.className = `flex-1 py-3 rounded-xl font-semibold text-sm transition ${A.saleType==='retail'?on:off}`;
  w.className = `flex-1 py-3 rounded-xl font-semibold text-sm transition ${A.saleType==='wholesale'?on:off}`;
}

function renderProductGrid() {
  const g = document.getElementById('productGrid');
  if (!g) return;
  const q = A.posSearch.trim().toLowerCase();
  const list = A.products.filter(p => {
    if (A.posCategory && p.category !== A.posCategory) return false;
    if (!q) return true;
    return (p.name||'').toLowerCase().includes(q) || (p.barcode||'').includes(q);
  });
  document.querySelectorAll('.cat-chip').forEach(b => {
    const on = b.dataset.cat === A.posCategory;
    b.className = `cat-chip flex-shrink-0 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap ${on ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 border border-gray-200'}`;
  });
  if (!list.length) {
    g.innerHTML = `<div class="col-span-2 text-center text-gray-400 py-16"><div class="text-5xl mb-3">📦</div><div>No products yet</div>
      <button onclick="goTo('products')" class="mt-3 text-blue-600 underline text-sm">Add a product</button></div>`;
    return;
  }
  g.innerHTML = list.map(p => {
    const price = A.saleType === 'retail' ? (+p.retailPrice||0) : (+p.wholesalePrice||0);
    const stock = +p.stockQty || 0;
    const out = stock <= 0, low = !out && stock <= (+p.lowStockAlert||0);
    return `<button data-add="${p.id}" class="text-left bg-white rounded-2xl p-3.5 shadow-sm border border-gray-100 active:scale-95 transition ${out?'opacity-50':''}">
      ${p.imageUrl ? `<img src="${TP.esc(p.imageUrl)}" class="w-full h-20 object-cover rounded-lg mb-2" onerror="this.style.display='none'">` : ''}
      <div class="font-semibold text-gray-800 text-sm leading-snug line-clamp-2 min-h-[2.6rem]">${TP.esc(p.name)}</div>
      ${p.barcode ? `<div class="text-[9px] text-gray-400 font-mono truncate">#${TP.esc(p.barcode)}</div>` : ''}
      <div class="text-[11px] mt-1 font-medium ${out?'text-red-600':low?'text-orange-500':'text-gray-500'}">
        Stock: ${stock} ${TP.esc(p.unit||'')}${out?' · out':low?' · low':''}
      </div>
      <div class="text-blue-600 font-extrabold mt-1.5 text-[17px]">${TP.money(price)}</div>
    </button>`;
  }).join('');
  g.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => addToCart(b.dataset.add)));
}

function addToCart(pid) {
  const p = A.products.find(x => x.id === pid);
  if (!p) return;
  const price = A.saleType === 'retail' ? (+p.retailPrice||0) : (+p.wholesalePrice||0);
  const exist = A.cart.find(it => it.productId === pid);
  const inCart = exist ? exist.qty : 0;
  if (inCart + 1 > (+p.stockQty||0)) { TP.toast('Out of stock!', 'error'); return; }
  if (exist) exist.qty++;
  else A.cart.push({ productId: pid, name: p.name, unit: p.unit||'', price, qty: 1 });
  updateCartBar();
}

function updateCartBar() {
  const bar = document.getElementById('cartBar');
  if (!bar) return;
  const count = A.cart.reduce((a, it) => a + it.qty, 0);
  const total = A.cart.reduce((a, it) => a + it.qty * it.price, 0);
  if (count === 0 || A.currentPage !== 'pos') { bar.classList.add('hide'); return; }
  bar.classList.remove('hide');
  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartTotal').textContent = TP.money(total);
}

document.getElementById('openCartBtn').addEventListener('click', openCart);

function openCart() {
  if (!A.cart.length) { TP.toast('Cart is empty', 'warn'); return; }
  A.custMode = 'walkin'; A.custId = '';

}

      </div>

    A.cart.splice(+b.dataset.rm, 1);

    if (!A.cart.length) closeModal('cartModal');
  }));
}

function updateSummary() {
  const subtotal = A.cart.reduce((a, it) => a + it.qty * it.price, 0);
  const discount = +((document.getElementById('discountInput')||{}).value || 0);
  const total = Math.max(0, subtotal - discount);
  let paid = (document.getElementById('paidInput')||{}).value;
  paid = paid === '' ? total : +paid;
  const due = Math.max(0, total - paid);
  const change = Math.max(0, paid - total);
  document.getElementById('sumSub').textContent = TP.money(subtotal);
  document.getElementById('sumDisc').textContent = '- ' + TP.money(discount);
  document.getElementById('sumTotal').textContent = TP.money(total);
  document.getElementById('sumPaid').textContent = TP.money(paid);
  document.getElementById('sumDue').textContent = TP.money(due);
  document.getElementById('sumChange').textContent = TP.money(change);
}

async function completeSale() {
  if (!A.cart.length) { TP.toast('Cart is empty', 'error'); return; }
  const subtotal = A.cart.reduce((a, it) => a + it.qty * it.price, 0);
  const discount = +((document.getElementById('discountInput')||{}).value || 0);
  const total = Math.max(0, subtotal - discount);
  let paidVal = (document.getElementById('paidInput')||{}).value;
  const paid = paidVal === '' ? total : (+paidVal || 0);
  const due = Math.max(0, total - paid);
  const method = (document.getElementById('payMethod')||{}).value || 'cash';
  const btn = document.getElementById('checkoutBtn');

  let splitPayments = null;
  if (window._splitPayments && window._splitPayments.length) {
    splitPayments = window._splitPayments;
    window._splitPayments = null;
  }

  // UPI payment flow
  if (method === 'upi') {
    const st = A.profile.shop.settings || {};
    if (!st.upiId) { TP.toast('Set UPI ID in Settings first', 'error'); return; }
    let paidConfirm = false;
    if (A.paymentSessionId) {
      try {
        btn.disabled = true;
        btn.textContent = '📱 Sending to device...';
        const reqRef = await TP.createPaymentRequest(A.paymentSessionId, {
          amount: paid || total,
          invoiceNo: 'Pending',
        });
        const result = await showPaymentWaitModal({
          reqRef, amount: paid || total,
          shopName: st.shopName || A.profile.shop.shopName,
        });
        if (result === 'paid') { paidConfirm = true; TP.toast('✓ Payment confirmed', 'success'); }
        else { TP.toast('Payment cancelled', 'warn'); btn.disabled = false; btn.textContent = '✓ Complete Sale'; return; }
      } catch (e) {
        console.error(e);
        TP.toast('Could not reach device — using in-app QR', 'warn');
      }
    }
    if (!paidConfirm) {
      const payResult = await TP.showUPIPaymentModal({
        upiId: st.upiId, upiName: st.upiName,
        amount: paid || total, invoiceNo: 'Pending',
        shopName: st.shopName || A.profile.shop.shopName,
      });
      if (payResult !== 'received') {
        TP.toast('Payment cancelled', 'warn');
        btn.disabled = false; btn.textContent = '✓ Complete Sale';
        return;
      }
    }
  }

  btn.disabled = true; btn.textContent = 'Processing...';

  try {
    const shopRef = TP.db.collection('shops').doc(A.shopId);
    let customerId = null, customerName = 'Walk-in Customer', customerPhone = '';
    let newCustomerRef = null;
    if (A.custMode === 'existing') {
      const cid = (document.getElementById('custSelect')||{}).value || A.custId;
      if (!cid) throw new Error('Select a customer');
      const c = A.customers.find(x => x.id === cid);
      if (c) { customerId = c.id; customerName = c.name; customerPhone = c.phone || ''; }
    } else if (A.custMode === 'new') {
      const name = ((document.getElementById('newCustName')||{}).value || '').trim();
      const phone = ((document.getElementById('newCustPhone')||{}).value || '').trim();
      if (!name) throw new Error('Customer name required');
      newCustomerRef = shopRef.collection('customers').doc();
      customerId = newCustomerRef.id; customerName = name; customerPhone = phone;
    }
    const tk = TP.todayKey();
    const todayInvoices = A.sales.filter(s => (s.invoiceNo||'').includes('-' + tk + '-'));
    const maxSeq = todayInvoices.reduce((m, s) => Math.max(m, parseInt((s.invoiceNo||'').split('-').pop(), 10) || 0), 0);
    const invoiceNo = `INV-${tk}-${String(maxSeq + 1).padStart(4, '0')}`;
    const batch = TP.db.batch();
    const saleRef = shopRef.collection('sales').doc();
    for (const it of A.cart) {
      const p = A.products.find(x => x.id === it.productId);
      if (p) batch.update(shopRef.collection('products').doc(p.id), { stockQty: (+p.stockQty||0) - it.qty });
    }
    if (newCustomerRef) batch.set(newCustomerRef, { name: customerName, phone: customerPhone, address: '', due: due, loyaltyPoints: 0, createdAt: TP.FV.serverTimestamp() });
    else if (customerId && due > 0) {
      const c = A.customers.find(x => x.id === customerId);
      if (c) batch.update(shopRef.collection('customers').doc(c.id), { due: (+c.due||0) + due });
    }
    batch.set(saleRef, {
      invoiceNo, customerId, customerName, customerPhone,
      salesmanId: A.profile.uid, salesmanName: A.profile.name,
      type: A.saleType, items: A.cart.map(it => ({...it})),
      subtotal, discount, total, paid, due,
      paymentMethod: method,
      splitPayments: splitPayments,
      saleDate: TP.FV.serverTimestamp(),
    });
    await batch.commit();
    const sale = {
      id: saleRef.id, invoiceNo, customerId, customerName, customerPhone,
      salesmanId: A.profile.uid, salesmanName: A.profile.name,
      type: A.saleType, items: A.cart.map(it => ({...it})),
      subtotal, discount, total, paid, due,
      paymentMethod: method, splitPayments,
      saleDate: new Date(),
    };

    // Loyalty points
    const pointsEarned = TP.calculateLoyaltyEarn(total);
    if (customerId && pointsEarned > 0) {
      try {
        const c = A.customers.find(x => x.id === customerId);
        if (c) {
          await shopRef.collection('customers').doc(c.id).update({
            loyaltyPoints: (+c.loyaltyPoints || 0) + pointsEarned
          });
          await shopRef.collection('loyaltyTransactions').add({
            customerId, customerName, points: pointsEarned, type: 'earn',
            invoiceNo, timestamp: TP.FV.serverTimestamp(),
          });
        }
      } catch (e) { console.warn('loyalty:', e); }
    }

    // Commission
    const commRate = +A.profile.commissionRate || 0;
    if (commRate > 0) {
      const comm = TP.calculateCommission(total, commRate);
      await shopRef.collection('sales').doc(saleRef.id).update({
        commissionAmount: comm, commissionRate: commRate
      });
    }

    // Activity log
    TP.logActivity(A.shopId, A.profile.uid, A.profile.name, 'SALE', `${invoiceNo} · ₹${total}`);

    // Attendance
    try {
      await shopRef.collection('attendance').add({
        userId: A.profile.uid, userName: A.profile.name, role: 'admin',
        action: 'SALE', timestamp: TP.FV.serverTimestamp(),
        meta: { invoiceNo, total },
      });
    } catch (e) {}

    A.cart = [];
    closeModal('cartModal');
    setTimeout(() => showInvoice(sale), 200);
    TP.toast('Sale completed!', 'success');
  } catch (err) {
    console.error(err);
    TP.toast(err.message || 'Sale failed', 'error');
    btn.disabled = false; btn.textContent = '✓ Complete Sale';
  }
}

      </div>
      <label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">Payment 2 (optional)</label>

        <select id="_sp2m" style="flex:1;padding:10px;border:2px solid #e5e7eb;border-radius:10px;font-family:inherit">

          <option value="cash">💵 Cash</option>
          <option value="upi">💳 UPI</option>
          <option value="bkash">📱 bKash</option>
          <option value="card">💳 Card</option>
          <option value="bank">🏦 Bank</option>
        </select>
        <input id="_sp2a" type="number" min="0" step="1" placeholder="Amount" style="flex:1;padding:10px;border:2px solid #e5e7eb;border-radius:10px;font-family:inherit">
      </div>
      <div id="_splitSummary" style="background:#f9fafb;border-radius:10px;padding:10px;font-size:12px;margin-bottom:12px"></div>
      <button id="_splitApply" style="width:100%;background:#7c3aed;color:#fff;border:none;border-radius:12px;padding:14px;font-weight:700;font-size:15px;cursor:pointer">Apply Split</button>
    </div>`;
  document.body.appendChild(modal);

  const updateSplitSummary = () => {
    const a1 = +document.getElementById('_sp1a').value || 0;
    const a2 = +document.getElementById('_sp2a').value || 0;
    const paid = a1 + a2;
    const due = Math.max(0, total - paid);
    const change = Math.max(0, paid - total);
    document.getElementById('_splitSummary').innerHTML = `
      <div style="display:flex;justify-content:space-between"><span>Paid:</span><b>₹${paid.toFixed(2)}</b></div>
      <div style="display:flex;justify-content:space-between;color:#dc2626"><span>Due:</span><b>₹${due.toFixed(2)}</b></div>
      ${change>0?`<div style="display:flex;justify-content:space-between;color:#16a34a"><span>Change:</span><b>₹${change.toFixed(2)}</b></div>`:''}
    `;
  };
  document.getElementById('_sp1a').addEventListener('input', updateSplitSummary);
  document.getElementById('_sp2a').addEventListener('input', updateSplitSummary);
  updateSplitSummary();

  document.getElementById('_splitClose').onclick = () => modal.remove();
  document.getElementById('_splitApply').onclick = () => {
    const a1 = +document.getElementById('_sp1a').value || 0;
    const a2 = +document.getElementById('_sp2a').value || 0;
    const m1 = document.getElementById('_sp1m').value;
    const m2 = document.getElementById('_sp2m').value;
    const paid = a1 + a2;
    if (paid <= 0) { TP.toast('Enter payment amount', 'error'); return; }
    if (paid > total) { TP.toast('Paid exceeds total', 'error'); return; }
    const payments = [];
    if (a1 > 0) payments.push({ method: m1, amount: a1 });
    if (a2 > 0 && m2) payments.push({ method: m2, amount: a2 });
    window._splitPayments = payments;
    document.getElementById('paidInput').value = paid.toFixed(2);
    modal.remove();
    updateSummary();
    TP.toast('Split applied · ' + payments.length + ' payments', 'success');
  };
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
}

function printInvoice(sale, format) {
  const frame = document.getElementById('printFrame');
  const doc = frame.contentDocument || frame.contentWindow.document;
  doc.open(); doc.write(invoiceDoc(sale, format)); doc.close();
  setTimeout(() => { try { frame.contentWindow.focus(); frame.contentWindow.print(); } catch { TP.toast('Print failed', 'error'); } }, 400);
}

/* ============================================================
   PRODUCTS
   ============================================================ */
function renderProducts() {
  const el = document.getElementById('page-products');
  el.innerHTML = `
    <div class="p-3 space-y-3">
      <button id="addProd" class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-semibold shadow-lg">+ Add Product</button>
      <div class="grid grid-cols-2 gap-2">
        <button id="labelPrintBtn" class="bg-purple-600 text-white py-3 rounded-xl font-semibold text-sm shadow-lg">🏷️ Print Labels</button>
        <label class="bg-indigo-600 text-white py-3 rounded-xl font-semibold text-sm shadow-lg text-center cursor-pointer">
          📥 Import CSV
          <input id="csvInput" type="file" accept=".csv,text/csv" class="hidden">
        </label>
      </div>
      <input id="prodSearch" type="search" placeholder="🔍 Name / barcode..."
        class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white focus:border-blue-500 focus:outline-none">
      <div id="prodList" class="space-y-2"></div>
    </div>`;

  const renderList = (q = '') => {
    const list = A.products.filter(p => !q || (p.name||'').toLowerCase().includes(q.toLowerCase()) || (p.barcode||'').includes(q));
    document.getElementById('prodList').innerHTML = list.length ? list.map(p => {
      const stock = +p.stockQty || 0;
      const low = stock <= (+p.lowStockAlert || 0);
      return `
        <div class="bg-white rounded-xl p-3.5 shadow-sm border border-gray-100">
          <div class="font-semibold text-sm">${TP.esc(p.name)}</div>
          ${p.category ? `<div class="text-[10px] text-gray-400 mt-0.5">📁 ${TP.esc(p.category)}</div>` : ''}
          ${p.barcode ? `<div class="text-[10px] text-gray-500 font-mono mt-0.5">🏷️ #${TP.esc(p.barcode)}</div>` : ''}
          <div class="flex flex-wrap gap-x-3 gap-y-0.5 text-xs text-gray-500 mt-1.5">
            <span>🏪 <b class="text-gray-700">${TP.money(p.retailPrice)}</b></span>
            <span>🏭 <b class="text-gray-700">${TP.money(p.wholesalePrice)}</b></span>
          </div>
          <div class="mt-1.5">
            <span class="inline-block px-2 py-0.5 rounded-md text-[11px] font-semibold
              ${stock<=0?'bg-red-100 text-red-600':low?'bg-orange-100 text-orange-700':'bg-green-100 text-green-700'}">
              Stock: ${stock} ${TP.esc(p.unit||'')}
            </span>
          </div>
          <div class="flex gap-2 mt-3 pt-3 border-t border-gray-100 flex-wrap">
            <button data-pqr="${p.id}" class="flex-1 min-w-[60px] bg-purple-50 text-purple-700 py-2 rounded-lg text-xs font-semibold">📱 QR</button>
            <button data-pstock="${p.id}" class="flex-1 min-w-[60px] bg-green-50 text-green-700 py-2 rounded-lg text-xs font-semibold">📦 Stock</button>
            <button data-pedit="${p.id}" class="flex-1 min-w-[60px] bg-blue-50 text-blue-600 py-2 rounded-lg text-xs font-semibold">✏️ Edit</button>
            <button data-pdel="${p.id}" class="px-3 bg-red-50 text-red-600 py-2 rounded-lg text-xs font-semibold">🗑</button>
          </div>
        </div>`;
    }).join('') : `<div class="bg-white rounded-xl p-8 text-center text-gray-400">No products yet</div>`;

    document.querySelectorAll('[data-pedit]').forEach(b => b.addEventListener('click', () => openProductForm(b.dataset.pedit)));
    document.querySelectorAll('[data-pdel]').forEach(b => b.addEventListener('click', async () => {
      const p = A.products.find(x => x.id === b.dataset.pdel);
      if (!p) return;
      if (await TP.askConfirm(`Delete "${p.name}"?`)) {
        await TP.db.collection('shops').doc(A.shopId).collection('products').doc(p.id).delete();
        TP.logActivity(A.shopId, A.profile.uid, A.profile.name, 'PRODUCT_DELETE', p.name);
        TP.toast('Deleted', 'success');
      }
    }));
    document.querySelectorAll('[data-pstock]').forEach(b => b.addEventListener('click', () => {
      const p = A.products.find(x => x.id === b.dataset.pstock);
      if (!p) return;
      openForm(`Add Stock — ${p.name}`,
        [
          { name: 'qty', label: `Quantity (current: ${p.stockQty} ${p.unit||''})`, type: 'number', required: true, min: 0, step: '0.01', default: 10 },
          { name: 'note', label: 'Note (optional)' },
        ], {}, async d => {
          const qty = +d.qty;
          if (!qty || qty <= 0) throw new Error('Enter a valid quantity');
          await TP.db.collection('shops').doc(A.shopId).collection('products').doc(p.id).update({ stockQty: (+p.stockQty||0) + qty });
          TP.toast(`${qty} ${p.unit||''} added`, 'success');
        });
    }));
    document.querySelectorAll('[data-pqr]').forEach(b => b.addEventListener('click', () => {
      const p = A.products.find(x => x.id === b.dataset.pqr);
      if (!p) return;
      if (!p.barcode) { TP.toast('No barcode on this product', 'warn'); return; }
      showProductQRModal(p.name, p.barcode);
    }));
  };

  renderList();
  document.getElementById('prodSearch').addEventListener('input', e => renderList(e.target.value));
  document.getElementById('addProd').addEventListener('click', () => openProductForm(null));
  document.getElementById('labelPrintBtn').addEventListener('click', () => {
    if (!A.products.length) { TP.toast('No products', 'warn'); return; }
    TP.printLabelSheet(A.products, A.profile.shop.settings || {});
  });
  document.getElementById('csvInput').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const rows = TP.parseCSV(text);
      if (!rows.length) { TP.toast('CSV empty', 'error'); return; }
      if (!rows[0].name) { TP.toast('CSV needs "name" column', 'error'); return; }
      if (!await TP.askConfirm(`Import ${rows.length} products?`)) return;
      const shopRef = TP.db.collection('shops').doc(A.shopId);
      const batch = TP.db.batch();
      let count = 0;
      for (const r of rows) {
        if (!r.name) continue;
        const ref = shopRef.collection('products').doc();
        batch.set(ref, {
          name: r.name, category: r.category || '',
          barcode: r.barcode || TP.generateBarcode(),
          unit: r.unit || 'pcs',
          retailPrice: +r.retailPrice || 0,
          wholesalePrice: +r.wholesalePrice || 0,
          stockQty: +r.stockQty || 0,
          lowStockAlert: +r.lowStockAlert || 5,
          imageUrl: r.imageUrl || '',
          variantGroup: r.variantGroup || '',
          createdAt: TP.FV.serverTimestamp(),
        });
        count++;
      }
      await batch.commit();
      TP.logActivity(A.shopId, A.profile.uid, A.profile.name, 'CSV_IMPORT', `${count} products imported`);
      TP.toast(`${count} products imported`, 'success');
    } catch (err) {
      console.error(err);
      TP.toast('CSV import failed', 'error');
    }
    e.target.value = '';
  });
}

function openProductForm(id) {
  const p = id ? A.products.find(x => x.id === id) : null;
  const autoBarcode = p ? (p.barcode || '') : TP.generateBarcode();
  openForm(p ? 'Edit Product' : 'New Product',
    [
      { name: 'name', label: 'Name', required: true },
      { name: 'category', label: 'Category', placeholder: 'e.g. Shirt, Saree' },
      { name: 'barcode', label: '🏷️ Barcode / QR (auto)', default: autoBarcode },
      { name: 'unit', label: 'Unit', default: 'pcs' },
      { name: 'retailPrice', label: 'Retail Price (₹)', type: 'number', step: '0.01', required: true, min: 0 },
      { name: 'wholesalePrice', label: 'Wholesale Price (₹)', type: 'number', step: '0.01', required: true, min: 0 },
      { name: 'stockQty', label: 'Stock', type: 'number', step: '0.01', required: true, min: 0 },
      { name: 'lowStockAlert', label: 'Low stock alert', type: 'number', step: '1', default: 5, min: 0 },
      { name: 'imageUrl', label: '🖼️ Image URL (optional)', placeholder: 'https://...' },
      { name: 'variantGroup', label: 'Variant group (optional)', placeholder: 'e.g. T-Shirt' },
    ], p ? { ...p } : { barcode: autoBarcode },
    async d => {
      const ref = TP.db.collection('shops').doc(A.shopId).collection('products');
      const barcode = (d.barcode || '').trim() || autoBarcode;
      if (!p) {
        const dup = A.products.find(x => x.barcode === barcode);
        if (dup) throw new Error('Barcode already used: ' + barcode);
      }
      const body = {
        name: d.name.trim(), category: (d.category||'').trim(), barcode,
        unit: (d.unit||'').trim(), retailPrice: +d.retailPrice || 0,
        wholesalePrice: +d.wholesalePrice || 0, stockQty: +d.stockQty || 0,
        lowStockAlert: +d.lowStockAlert || 0,
        imageUrl: (d.imageUrl || '').trim(),
        variantGroup: (d.variantGroup || '').trim(),
      };
      if (p) {
        await ref.doc(p.id).update(body);
        TP.logActivity(A.shopId, A.profile.uid, A.profile.name, 'PRODUCT_EDIT', body.name);
      } else {
        await ref.add({ ...body, createdAt: TP.FV.serverTimestamp() });
        TP.logActivity(A.shopId, A.profile.uid, A.profile.name, 'PRODUCT_ADD', body.name);
      }
      TP.toast('Saved · Barcode: ' + barcode, 'success');
      setTimeout(() => showProductQRModal(d.name.trim(), barcode), 300);
    });
}

function showProductQRModal(name, barcode) {
  const old = document.getElementById('_prodQRModal');
  if (old) old.remove();
  const modal = document.createElement('div');
  modal.id = '_prodQRModal';
  modal.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;font-family:Inter,sans-serif`;
  modal.innerHTML = `
    <div style="background:#fff;border-radius:22px;max-width:420px;width:100%;padding:24px;text-align:center">
      <div style="font-size:36px;margin-bottom:6px">🏷️</div>
      <h3 style="font-weight:800;font-size:17px;margin:0 0 4px">${TP.esc(name)}</h3>
      <p style="color:#6b7280;font-size:12px;margin:0 0 16px">Save barcode / QR</p>
      <div id="_prodQRImg" style="margin-bottom:14px">
        <div style="background:#fff;padding:10px;border-radius:12px;display:inline-block;border:1px solid #e5e7eb">Generating QR...</div>
      </div>
      <div style="background:#f9fafb;padding:10px;border-radius:10px;font-family:monospace;font-size:13px;font-weight:700;color:#374151;letter-spacing:1px;margin-bottom:14px">${TP.esc(barcode)}</div>
      <button id="_prodQRDown" style="width:100%;background:#7c3aed;color:#fff;padding:12px;border:none;border-radius:12px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;margin-bottom:8px">📥 Download QR</button>
      <button id="_prodQRClose" style="width:100%;background:#f3f4f6;color:#374151;padding:12px;border:none;border-radius:12px;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer">Close</button>
    </div>`;
  document.body.appendChild(modal);

  TP.generateQRDataURL(barcode, 500).then(url => {
    document.getElementById('_prodQRImg').innerHTML = `
      <div style="background:#fff;padding:10px;border-radius:12px;display:inline-block;border:1px solid #e5e7eb">
        <img src="${url}" style="width:230px;height:230px;display:block">
      </div>`;
    document.getElementById('_prodQRDown').onclick = () => TP.downloadDataURL(url, `QR-${barcode}.png`);
  }).catch(() => {
    document.getElementById('_prodQRImg').innerHTML = `<div style="color:#dc2626;padding:20px">QR failed</div>`;
  });

  document.getElementById('_prodQRClose').onclick = () => modal.remove();
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
}

  el.innerHTML = `
    <div class="p-3 space-y-3">
      <div class="bg-gradient-to-br from-red-50 to-orange-50 border border-red-100 rounded-2xl p-4">
        <div class="text-xs text-gray-600 font-medium">Total Due</div>
        <div class="text-2xl font-extrabold text-red-600 mt-0.5">${TP.money(totalDue)}</div>
        <div class="text-[11px] text-gray-500 mt-1">${A.customers.filter(c => (+c.due||0) > 0).length} customers</div>
      </div>
      <button id="addCust" class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-semibold shadow-lg">+ Add Customer</button>

      <div id="custList" class="space-y-2"></div>

    document.getElementById('custList').innerHTML = list.length ? list.map(c => `
      <div class="bg-white rounded-xl p-3.5 shadow-sm border border-gray-100">
        <div class="flex justify-between items-start gap-2">
          <div class="min-w-0 flex-1">
            <div class="font-semibold text-sm truncate">${TP.esc(c.name)}</div>
            ${c.phone ? `<div class="text-xs text-gray-500 mt-0.5">📞 ${TP.esc(c.phone)}</div>` : ''}
            ${c.address ? `<div class="text-[11px] text-gray-400 mt-0.5 truncate">📍 ${TP.esc(c.address)}</div>` : ''}
            ${(+c.loyaltyPoints || 0) > 0 ? `<div class="text-[10px] text-purple-600 font-semibold mt-0.5">⭐ ${c.loyaltyPoints} pts</div>` : ''}
          </div>
          <div class="text-right">
            ${(+c.due||0) > 0 ? `<div class="font-bold text-red-600 text-sm">Due ${TP.money(c.due)}</div>` : `<div class="text-xs text-green-600 font-medium">Clear</div>`}
          </div>
        </div>
        <div class="flex gap-2 mt-3 pt-3 border-t border-gray-100 flex-wrap">
          <button data-cpay="${c.id}" class="flex-1 min-w-[70px] bg-green-50 text-green-700 py-2 rounded-lg text-xs font-semibold">💵 Payment</button>
          ${(+c.due || 0) > 0 && c.phone ? `<button data-cremind="${c.id}" class="flex-1 min-w-[70px] bg-green-100 text-green-800 py-2 rounded-lg text-xs font-semibold">💬 Remind</button>` : ''}
          <button data-cedit="${c.id}" class="flex-1 min-w-[70px] bg-blue-50 text-blue-600 py-2 rounded-lg text-xs font-semibold">✏️ Edit</button>
          <button data-cdel="${c.id}" class="px-3 bg-red-50 text-red-600 py-2 rounded-lg text-xs font-semibold">🗑</button>
        </div>
      </div>`).join('') : `<div class="bg-white rounded-xl p-8 text-center text-gray-400">No customers yet</div>`;
    document.querySelectorAll('[data-cpay]').forEach(b => b.addEventListener('click', () => openPaymentModal(b.dataset.cpay)));
    document.querySelectorAll('[data-cedit]').forEach(b => b.addEventListener('click', () => openCustomerForm(b.dataset.cedit)));
    document.querySelectorAll('[data-cremind]').forEach(b => b.addEventListener('click', () => {
      const c = A.customers.find(x => x.id === b.dataset.cremind);
      if (!c || !c.phone) return;
      TP.openWhatsApp(c.phone, TP.buildDueReminderMessage(c, A.profile.shop.settings || {}));
    }));
    document.querySelectorAll('[data-cdel]').forEach(b => b.addEventListener('click', async () => {
      const c = A.customers.find(x => x.id === b.dataset.cdel);
      if (!c) return;
      if (+c.due > 0) { TP.toast('Cannot delete customer with pending due', 'error'); return; }
      if (await TP.askConfirm(`Delete "${c.name}"?`)) {
        await TP.db.collection('shops').doc(A.shopId).collection('customers').doc(c.id).delete();
        TP.toast('Deleted', 'success');
      }
    }));
  };
  renderList();
  document.getElementById('custSearch').addEventListener('input', e => renderList(e.target.value));
  document.getElementById('addCust').addEventListener('click', () => openCustomerForm(null));
}

function openCustomerForm(id) {
  const c = id ? A.customers.find(x => x.id === id) : null;
  openForm(c ? 'Edit Customer' : 'Add Customer',
    [
      { name: 'name', label: 'Name', required: true },
      { name: 'phone', label: 'Mobile', type: 'tel' },
      { name: 'address', label: 'Address', type: 'textarea' },
    ], c ? { name: c.name, phone: c.phone, address: c.address } : {},
    async d => {
      const ref = TP.db.collection('shops').doc(A.shopId).collection('customers');
      const body = { name: d.name.trim(), phone: d.phone.trim(), address: (d.address||'').trim(), due: c ? (+c.due||0) : 0 };
      if (c) await ref.doc(c.id).update(body);
      else { body.loyaltyPoints = 0; await ref.add({ ...body, createdAt: TP.FV.serverTimestamp() }); }
      TP.toast('Saved', 'success');
    });
}

function openPaymentModal(custId) {
  const c = A.customers.find(x => x.id === custId);
  if (!c) return;
  openForm(`Receive Payment — ${c.name}`,
    [
      { name: 'amount', label: `Amount (due: ${TP.money(c.due)})`, type: 'number', required: true, min: 1, default: c.due },
      { name: 'method', label: 'Method', type: 'select', options: [
        { value: 'cash', label: '💵 Cash' }, { value: 'bkash', label: '📱 bKash' },
        { value: 'upi', label: '💳 UPI' },
        { value: 'card', label: '💳 Card' }, { value: 'bank', label: '🏦 Bank' }]},
      { name: 'note', label: 'Note (optional)' },
    ], {}, async d => {
      const amt = +d.amount;
      if (!amt || amt <= 0) throw new Error('Enter valid amount');
      if (amt > (+c.due||0)) throw new Error('Exceeds due amount');
      const shopRef = TP.db.collection('shops').doc(A.shopId);
      const batch = TP.db.batch();
      batch.update(shopRef.collection('customers').doc(c.id), { due: (+c.due||0) - amt });
      batch.set(shopRef.collection('payments').doc(), {
        customerId: c.id, customerName: c.name, amount: amt, method: d.method,
        note: d.note || '', salesmanName: A.profile.name, paymentDate: TP.FV.serverTimestamp(),
      });
      await batch.commit();
      TP.toast(`${TP.money(amt)} received`, 'success');
    });
}

              <div class="grid grid-cols-2 gap-2 mt-3">

                <button data-del-sm="${u.id}" class="flex-1 bg-red-50 text-red-600 py-2 rounded-lg text-xs font-semibold">🗑 Delete</button>

            </div>`;
        }).join('') : `<div class="bg-white rounded-xl p-8 text-center text-gray-400">No salesmen yet</div>`}
      </div>

        { name: 'name', label: 'Full name', required: true },
        { name: 'username', label: 'Username (English)', required: true, placeholder: 'e.g. karim' },
        { name: 'password', label: 'Temporary password', required: true, default: tmpPw },
        { name: 'commissionRate', label: 'Commission % (optional)', type: 'number', min: 0, max: 100, step: '0.1', default: 0 },
      ], {}, async d => {
        const uname = d.username.trim().toLowerCase().replace(/\s+/g, '');

        if ((d.password||'').length < 6) throw new Error('Password min 6 chars');
        if (A.users.find(u => u.username === uname)) throw new Error('Username taken');
        const email = TP.salesmanEmail(A.shopId, uname);

        let newUid;
        try {

    const u = A.users.find(x => x.id === b.dataset.delSm);
    if (!u) return;
    if (await TP.askConfirm(`Delete "${u.name}"?`)) {
      try { await TP.db.collection('users').doc(u.id).delete(); TP.toast('Deleted', 'success'); }
      catch (e) { TP.toast(e.message, 'error'); }
    }
  }));
}

function openPurchaseForm() {
  const old = document.getElementById('_purModal');
  if (old) old.remove();
  const modal = document.createElement('div');
  modal.id = '_purModal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:flex-start;justify-content:center;padding:12px;font-family:Inter,sans-serif;overflow-y:auto';
  const tempCart = [];

  const renderModal = () => {
    modal.innerHTML = `
      <div style="background:#fff;border-radius:20px;max-width:500px;width:100%;padding:20px;max-height:94vh;overflow-y:auto;margin-top:20px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
          <h3 style="font-weight:800;font-size:17px;margin:0">📥 New Purchase</h3>
          <button id="_purClose" style="background:#f3f4f6;border:none;width:32px;height:32px;border-radius:8px;font-size:18px;cursor:pointer">×</button>
        </div>
        <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:4px">Supplier name</label>
        <input id="_purSupplier" placeholder="e.g. ABC Textiles" style="width:100%;padding:10px;border:2px solid #e5e7eb;border-radius:10px;font-family:inherit;margin-bottom:10px;box-sizing:border-box">
        <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:4px">Add items</label>
        <div style="background:#f9fafb;border-radius:12px;padding:10px;margin-bottom:10px">
          <select id="_purProd" style="width:100%;padding:8px;border:2px solid #e5e7eb;border-radius:8px;font-family:inherit;margin-bottom:6px;box-sizing:border-box">
            <option value="">-- Select product --</option>
            ${A.products.map(p => `<option value="${p.id}">${TP.esc(p.name)} (${p.stockQty} ${p.unit||''})</option>`).join('')}
          </select>
          <div style="display:flex;gap:6px">
            <input id="_purQty" type="number" min="1" step="0.01" placeholder="Qty" style="flex:1;padding:8px;border:2px solid #e5e7eb;border-radius:8px;font-family:inherit">
            <input id="_purPrice" type="number" min="0" step="0.01" placeholder="Unit ₹" style="flex:1;padding:8px;border:2px solid #e5e7eb;border-radius:8px;font-family:inherit">
            <button id="_purAddItem" style="background:#7c3aed;color:#fff;border:none;border-radius:8px;padding:0 14px;font-weight:700;font-size:13px;cursor:pointer">Add</button>
          </div>
        </div>
        <div id="_purItems" style="margin-bottom:10px">
          ${tempCart.length ? tempCart.map((it, i) => `
            <div style="display:flex;justify-content:space-between;padding:8px;background:#f9fafb;border-radius:8px;margin-bottom:4px;font-size:13px">
              <div>${TP.esc(it.name)} — ${it.qty} × ₹${it.price}</div>
              <div style="display:flex;gap:8px;align-items:center">
                <b>₹${(it.qty*it.price).toFixed(2)}</b>
                <button data-pur-rm="${i}" style="background:#fee2e2;color:#dc2626;border:none;border-radius:6px;padding:2px 6px;font-size:11px;cursor:pointer">✕</button>
              </div>
            </div>`).join('') : '<div style="color:#9ca3af;font-size:12px;text-align:center;padding:10px">No items</div>'}
        </div>
        <div style="background:#f5f3ff;border-radius:10px;padding:10px;margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-weight:700"><span>Total</span><span>₹${tempCart.reduce((a,it)=>a+it.qty*it.price,0).toFixed(2)}</span></div>
        </div>
        <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:4px">Note (optional)</label>
        <input id="_purNote" placeholder="Any note..." style="width:100%;padding:10px;border:2px solid #e5e7eb;border-radius:10px;font-family:inherit;margin-bottom:12px;box-sizing:border-box">
        <button id="_purSave" style="width:100%;background:#7c3aed;color:#fff;border:none;border-radius:12px;padding:14px;font-weight:700;font-size:15px;cursor:pointer">Save Purchase</button>
      </div>`;
    document.getElementById('_purClose').onclick = () => modal.remove();
    document.getElementById('_purAddItem').onclick = () => {
      const pid = document.getElementById('_purProd').value;
      const qty = +document.getElementById('_purQty').value;
      const price = +document.getElementById('_purPrice').value;
      if (!pid || !qty || !price) { TP.toast('Product + qty + price required', 'error'); return; }
      const p = A.products.find(x => x.id === pid);
      tempCart.push({ productId: pid, name: p.name, unit: p.unit || '', qty, price });
      renderModal();
    };
    modal.querySelectorAll('[data-pur-rm]').forEach(b => b.addEventListener('click', () => {
      tempCart.splice(+b.dataset.purRm, 1);
      renderModal();
    }));
    document.getElementById('_purSave').onclick = async () => {
      const supplier = document.getElementById('_purSupplier').value.trim();
      const note = document.getElementById('_purNote').value.trim();
      if (!tempCart.length) { TP.toast('Add at least one item', 'error'); return; }
      const total = tempCart.reduce((a, it) => a + it.qty * it.price, 0);
      const batch = TP.db.batch();
      const shopRef = TP.db.collection('shops').doc(A.shopId);
      const purRef = shopRef.collection('purchases').doc();
      batch.set(purRef, {
        supplier, note, items: tempCart.map(it => ({ ...it })),
        total, salesmanName: A.profile.name,
        purchaseDate: TP.FV.serverTimestamp(),
      });
      for (const it of tempCart) {
        const p = A.products.find(x => x.id === it.productId);
        if (p) batch.update(shopRef.collection('products').doc(p.id), { stockQty: (+p.stockQty || 0) + it.qty });
      }
      await batch.commit();
      modal.remove();
      TP.logActivity(A.shopId, A.profile.uid, A.profile.name, 'PURCHASE', `₹${total} from ${supplier}`);
      TP.toast('Purchase saved · Stock updated', 'success');
    };
    modal.addEventListener('click', e => { if (e.target === modal && e.target.id === '_purModal') modal.remove(); });
  };
  document.body.appendChild(modal);
  renderModal();
}

function openReturnForm() {
  const recentSales = A.sales.slice(0, 30);
  if (!recentSales.length) { TP.toast('No recent sales', 'warn'); return; }
  const options = recentSales.map(s => ({
    value: s.id,
    label: `${s.invoiceNo} · ${s.customerName} · ₹${s.total}`,
  }));
  openForm('New Return / Refund',
    [
      { name: 'saleId', label: 'Select invoice', type: 'select', required: true, options: [{ value: '', label: '-- Choose --' }, ...options] },
      { name: 'refundMethod', label: 'Refund method', type: 'select', options: [
        { value: 'cash', label: '💵 Cash' },
        { value: 'upi', label: '💳 UPI' },
        { value: 'adjust_due', label: '📝 Adjust against due' },
      ]},
      { name: 'note', label: 'Reason / Note', type: 'textarea' },
    ], {}, async d => {
      const sale = A.sales.find(s => s.id === d.saleId);
      if (!sale) throw new Error('Select a valid invoice');
      const shopRef = TP.db.collection('shops').doc(A.shopId);
      const batch = TP.db.batch();
      const ref = shopRef.collection('returns').doc();
      batch.set(ref, {
        saleId: sale.id, invoiceNo: sale.invoiceNo,
        customerId: sale.customerId || null, customerName: sale.customerName,
        items: sale.items.map(it => ({ ...it })),
        total: sale.total, refundMethod: d.refundMethod,
        note: (d.note || '').trim(),
        salesmanName: A.profile.name,
        returnDate: TP.FV.serverTimestamp(),
      });
      for (const it of sale.items) {
        const p = A.products.find(x => x.id === it.productId);
        if (p) batch.update(shopRef.collection('products').doc(p.id), { stockQty: (+p.stockQty || 0) + (+it.qty || 0) });
      }
      if (d.refundMethod === 'adjust_due' && sale.customerId) {
        const c = A.customers.find(x => x.id === sale.customerId);
        if (c) batch.update(shopRef.collection('customers').doc(c.id), { due: Math.max(0, (+c.due || 0) - sale.total) });
      }
      await batch.commit();
      TP.logActivity(A.shopId, A.profile.uid, A.profile.name, 'RETURN', `${sale.invoiceNo} ₹${sale.total}`);
      TP.toast('Return recorded', 'success');
    });
}

async function restoreCurrentShift() {
  try {
    const raw = localStorage.getItem('tp_current_shift');
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s.shopId !== A.shopId || s.userId !== A.profile.uid) return;
    const doc = await TP.db.collection('shops').doc(A.shopId).collection('shifts').doc(s.shiftId).get();
    if (!doc.exists || doc.data().status === 'closed') { localStorage.removeItem('tp_current_shift'); return; }
    A.currentShiftId = s.shiftId;
    A.currentShift = { id: s.shiftId, ...doc.data() };
  } catch (e) { console.warn(e); }
}

async function closeShift(expectedCash) {
  const result = await new Promise(res => {
    const old = document.getElementById('_closeShiftModal');
    if (old) old.remove();
    const modal = document.createElement('div');
    modal.id = '_closeShiftModal';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;font-family:Inter,sans-serif';
    modal.innerHTML = `
      <div style="background:#fff;border-radius:22px;max-width:400px;width:100%;padding:22px">
        <h3 style="font-weight:800;font-size:17px;margin:0 0 6px">🔒 Close Shift</h3>
        <p style="font-size:12px;color:#6b7280;margin:0 0 14px">Expected cash: <b>₹${expectedCash.toFixed(2)}</b></p>
        <label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">Actual cash counted (₹)</label>
        <input id="_csActual" type="number" min="0" step="0.01" placeholder="Enter counted cash" style="width:100%;padding:12px;border:2px solid #e5e7eb;border-radius:10px;font-family:inherit;font-size:16px;box-sizing:border-box;margin-bottom:8px">
        <label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">Note (optional)</label>
        <input id="_csNote" placeholder="Any discrepancies?" style="width:100%;padding:10px;border:2px solid #e5e7eb;border-radius:10px;font-family:inherit;margin-bottom:14px;box-sizing:border-box">
        <div style="display:flex;gap:8px">
          <button id="_csCancel" style="flex:1;background:#f3f4f6;color:#374151;border:none;border-radius:12px;padding:13px;font-weight:700;cursor:pointer;font-family:inherit">Cancel</button>
          <button id="_csConfirm" style="flex:1;background:#dc2626;color:#fff;border:none;border-radius:12px;padding:13px;font-weight:700;cursor:pointer;font-family:inherit">Close Shift</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
    document.getElementById('_csCancel').onclick = () => { modal.remove(); res(null); };
    document.getElementById('_csConfirm').onclick = () => {
      const actual = +document.getElementById('_csActual').value || 0;
      const note = document.getElementById('_csNote').value || '';
      modal.remove();
      res({ actual, note });
    };
  });
  if (!result) return;
  const variance = result.actual - expectedCash;
  await TP.db.collection('shops').doc(A.shopId).collection('shifts').doc(A.currentShiftId).update({
    status: 'closed', closingCash: result.actual, expectedCash,
    variance, note: result.note, closedAt: TP.FV.serverTimestamp(),
  });
  TP.logActivity(A.shopId, A.profile.uid, A.profile.name, 'SHIFT_CLOSE', `Variance: ₹${variance.toFixed(2)}`);
  A.currentShiftId = null;
  A.currentShift = null;
  localStorage.removeItem('tp_current_shift');
  TP.toast('Shift closed', 'success');
  renderShift();
}

/* ============================================================

function renderAnalytics() {
  const el = document.getElementById('page-analytics');
  const days = 14;
  const daily = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = TP.todayKey(d);
    const daySales = A.sales.filter(s => {
      const sd = s.saleDate?.toDate ? s.saleDate.toDate() : new Date(s.saleDate);
      return TP.todayKey(sd) === key;
    });
    daily.push({
      label: String(d.getDate()) + '/' + String(d.getMonth()+1),
      total: daySales.reduce((a, s) => a + (+s.total || 0), 0),
    });
  }
  const maxVal = Math.max(1, ...daily.map(d => d.total));

  const catMap = {};
  A.sales.forEach(s => s.items?.forEach(it => {
    const p = A.products.find(x => x.id === it.productId);
    const cat = p?.category || 'Uncategorized';
    catMap[cat] = (catMap[cat] || 0) + (+it.qty || 0) * (+it.price || 0);
  }));
  const catList = Object.entries(catMap).sort((a,b) => b[1] - a[1]).slice(0, 8);
  const catMax = Math.max(1, ...catList.map(x => x[1]));

  // Forecast
  const monthly = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = TP.todayKey(d);
    const total = A.sales.filter(s => {
      const sd = s.saleDate?.toDate ? s.saleDate.toDate() : new Date(s.saleDate);
      return TP.todayKey(sd) === key;
    }).reduce((a, s) => a + (+s.total || 0), 0);
    monthly.push({ total });
  }
  const forecast = TP.forecastSales(monthly, 7);
  const next7 = forecast.predictions.reduce((a,b) => a+b, 0);
  const trendPct = forecast.avg > 0 ? ((forecast.trend / forecast.avg) * 100).toFixed(1) : 0;

  el.innerHTML = `

            <div class="text-lg font-extrabold ${forecast.trend >= 0 ? 'text-green-600' : 'text-red-600'}">
              ${forecast.trend >= 0 ? '↑' : '↓'} ${Math.abs(trendPct)}%
            </div>
          </div>
        </div>
        <div class="text-[10px] text-gray-500">Based on last 30 days</div>

      <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">

          ${daily.map(d => `

              <div class="w-full bg-gradient-to-t from-blue-500 to-blue-400 rounded-t" style="height:${Math.max(4, d.total/maxVal*110)}px"></div>
              <div class="text-[8px] text-gray-400 mt-1">${d.label}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <h3 class="font-bold text-sm mb-3">🏷️ Category Breakdown</h3>
        ${catList.length ? catList.map(([cat, amt]) => `
          <div class="mb-2">
            <div class="flex justify-between text-xs">

            </div>
          </div>
        `).join('') : '<div class="text-gray-400 text-xs text-center py-4">No data</div>'}
      </div>

      <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <h3 class="font-bold text-sm mb-3">💳 Payment Methods</h3>
        ${(() => {
          const methods = {};

  const box = document.getElementById('scannerSessionBox');

    box.innerHTML = `

    document.getElementById('btnStartScanner').addEventListener('click', startScannerSession);
    return;
  }
  box.innerHTML = `
    <div class="bg-blue-50 border border-blue-300 rounded-xl p-3 mb-3">
      <div class="flex items-center gap-2 mb-2"><span class="w-2.5 h-2.5 rounded-full bg-blue-500 pulse"></span>
