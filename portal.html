<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Customer Portal — TextilePOS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Inter',system-ui,sans-serif; margin:0; }
  .hide{ display:none !important; }
</style>
</head>
<body class="bg-gray-100 min-h-screen">

<div class="max-w-md mx-auto p-4">
  <div class="text-center my-6">
    <div class="text-5xl mb-2">🧵</div>
    <h1 class="text-2xl font-extrabold text-gray-800">Customer Portal</h1>
    <p class="text-xs text-gray-500 mt-1">View your invoices & dues</p>
  </div>

  <div id="loginPanel" class="bg-white rounded-2xl p-6 shadow-sm">
    <label class="block text-xs font-bold text-gray-600 mb-1">Shop ID</label>
    <input id="inpShop" placeholder="SHOP-XXXXXX"
      class="w-full px-3 py-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none mb-3 font-mono uppercase">

    <label class="block text-xs font-bold text-gray-600 mb-1">Your phone number</label>
    <input id="inpPhone" type="tel" inputmode="numeric" placeholder="10-digit mobile"
      class="w-full px-3 py-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none mb-4">

    <button id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-xl font-bold transition active:scale-[.98]">
      View My Account
    </button>
    <p id="loginErr" class="text-xs text-red-600 mt-2 text-center"></p>
  </div>

  <div id="dashPanel" class="hide space-y-3">
    <div class="bg-white rounded-2xl p-4 shadow-sm">
      <div class="text-xs text-gray-500">Welcome</div>
      <div class="text-xl font-extrabold" id="custName">—</div>
      <div class="text-xs text-gray-500 mt-1" id="shopName">—</div>
      <button id="logoutBtn" class="mt-3 text-xs text-red-600 underline">Logout</button>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div class="bg-white rounded-2xl p-4 shadow-sm">
        <div class="text-[10px] text-gray-500">Pending Due</div>
        <div class="text-xl font-extrabold text-red-600 mt-1" id="dueAmt">₹0</div>
      </div>
      <div class="bg-white rounded-2xl p-4 shadow-sm">
        <div class="text-[10px] text-gray-500">Loyalty Points</div>
        <div class="text-xl font-extrabold text-purple-600 mt-1" id="loyaltyPts">0</div>
      </div>
    </div>

    <div class="bg-white rounded-2xl p-4 shadow-sm">
      <h3 class="font-bold text-sm mb-3">🧾 Recent Invoices</h3>
      <div id="invoiceList" class="space-y-2"></div>
    </div>

    <div class="bg-blue-50 border border-blue-200 rounded-2xl p-3 text-[11px] text-gray-600 leading-relaxed">
      <b class="text-blue-700">ℹ️ Note:</b> This portal shows your purchase history. For payments, contact the shop.
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
(function() {
  'use strict';

  // Helper functions
  function fmtDate(iso) {
    if (!iso) return '';
    const d = iso.toDate ? iso.toDate() : new Date(iso);
    return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  // Check Firebase config
  if (!window.FIREBASE_CONFIG) {
    document.getElementById('loginErr').textContent = 'firebase-config.js not loaded';
    document.getElementById('loginBtn').disabled = true;
    return;
  }
  if (window.FIREBASE_CONFIG.apiKey === 'PASTE_YOUR_API_KEY_HERE') {
    document.getElementById('loginErr').textContent = 'Firebase config not set. Update firebase-config.js';
    document.getElementById('loginBtn').disabled = true;
    return;
  }

  // Init Firebase
  if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
  const db = firebase.firestore();

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const shopId = document.getElementById('inpShop').value.trim().toUpperCase();
    const phone = document.getElementById('inpPhone').value.replace(/\D/g,'');
    document.getElementById('loginErr').textContent = '';

    if (!shopId || !phone) {
      document.getElementById('loginErr').textContent = 'Enter Shop ID and phone';
      return;
    }

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Loading...';

    try {
      // Find shop
      const shopDoc = await db.collection('shops').doc(shopId).get();
      if (!shopDoc.exists) {
        document.getElementById('loginErr').textContent = 'Shop not found';
        return;
      }

      // Find customer by phone
      const custSnap = await db.collection('shops').doc(shopId).collection('customers')
        .where('phone', '==', phone).limit(1).get();
      if (custSnap.empty) {
        document.getElementById('loginErr').textContent = 'No customer with this phone';
        return;
      }

      const cust = { id: custSnap.docs[0].id, ...custSnap.docs[0].data() };

      // Show dashboard
      document.getElementById('loginPanel').classList.add('hide');
      document.getElementById('dashPanel').classList.remove('hide');
      document.getElementById('custName').textContent = cust.name || 'Customer';
      document.getElementById('shopName').textContent = shopDoc.data().shopName || 'Shop';
      document.getElementById('dueAmt').textContent = '₹' + Number(cust.due || 0).toFixed(2);
      document.getElementById('loyaltyPts').textContent = String(cust.loyaltyPoints || 0);

      // Load recent invoices
      try {
        const salesSnap = await db.collection('shops').doc(shopId).collection('sales')
          .where('customerId', '==', cust.id).orderBy('saleDate', 'desc').limit(20).get();
        const sales = salesSnap.docs.map(d => ({ id: d.id, ...d.data() }));

        document.getElementById('invoiceList').innerHTML = sales.length ? sales.map(s => `
          <div class="flex justify-between items-center bg-gray-50 rounded-lg p-2.5 text-xs">
            <div>
              <div class="font-semibold font-mono">${s.invoiceNo}</div>
              <div class="text-[10px] text-gray-500">${fmtDate(s.saleDate)}</div>
            </div>
            <div class="text-right">
              <div class="font-bold">₹${Number(s.total||0).toFixed(2)}</div>
              ${(+s.due||0)>0 ? `<div class="text-[10px] text-red-600">Due ₹${Number(s.due).toFixed(2)}</div>` : `<div class="text-[10px] text-green-600">Paid</div>`}
            </div>
          </div>
        `).join('') : '<div class="text-center text-gray-400 py-4 text-xs">No invoices yet</div>';
      } catch (e) {
        console.warn('Invoice load failed:', e);
        document.getElementById('invoiceList').innerHTML = '<div class="text-center text-gray-400 py-4 text-xs">Could not load invoices</div>';
      }

      localStorage.setItem('tp_portal', JSON.stringify({ shopId, custId: cust.id, phone }));

      document.getElementById('logoutBtn').onclick = () => {
        localStorage.removeItem('tp_portal');
        location.reload();
      };

    } catch (e) {
      console.error(e);
      document.getElementById('loginErr').textContent = e.message || 'Login failed';
    } finally {
      btn.disabled = false;
      btn.textContent = 'View My Account';
    }
  });

  // Auto-login
  try {
    const saved = JSON.parse(localStorage.getItem('tp_portal') || 'null');
    if (saved && saved.shopId && saved.phone) {
      document.getElementById('inpShop').value = saved.shopId;
      document.getElementById('inpPhone').value = saved.phone;
      setTimeout(() => document.getElementById('loginBtn').click(), 200);
    }
  } catch(e) {}

})();
</script>
</body>
</html>
